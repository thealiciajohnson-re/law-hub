      {t:'case', n:'Hart v. Curry (N.C. 1953) — PROXIMATE CAUSE / foreseeability of the NATURE/EXTENT of the injury (second appeal; death facts from the first appeal, Simpson v. Curry, 237 N.C. 260 — same case, new administrator). FACTS: the plaintiff\'s intestate, a pedestrian, was struck and killed at night crossing Hughes Boulevard (U.S. Hwy 17) in Elizabeth City, no marked crosswalk; the jury at trial found against the plaintiff on negligence. ISSUE: was the trial court\'s proximate-cause/foreseeability jury instruction proper? The challenged instruction told the jury it "must be shown that the death of plaintiff\'s intestate was the natural and probable result of the defendant\'s negligence, and that it ought to have been foreseen." HOLDING: NO — that instruction was ERRONEOUS and PREJUDICIAL to the plaintiff; assignment of error SUSTAINED and a NEW TRIAL ordered (for the plaintiff). RULE: the test of foreseeability does NOT require the defendant to have foreseen the injury in the PRECISE FORM in which it occurred or the PARTICULAR consequences; all the plaintiff must show is that in the exercise of reasonable care the defendant might have foreseen that SOME injury — consequences of a generally injurious nature — would result (Drum v. Miller). By demanding foreseeability of the specific death, the instruction set the bar too high. ELEMENT APPLIED: PROXIMATE CAUSE — the FORESEEABILITY sub-element (nature/extent of the injury). TAKEAWAY: the flip side of Osborne — an instruction (or argument) requiring foresight of the EXACT/particular injury is reversible error; you need foresee only that some general harm was likely. [CORRECTED per the professor\'s edited opinion — disposition is a new trial for the plaintiff, NOT an affirmance. Full briefs + presentation summaries in OneDrive/Bar Prep Guides.]'},
      {t:'rule', n:'Week 12 presentation — PROXIMATE CAUSE = LEGAL CAUSE / SCOPE OF LIABILITY (the 4th element). Distinct from ACTUAL cause (cause-in-fact/but-for, the FACTUAL part): a defendant\'s act can be the but-for cause yet still not be the LEGAL cause. Proximate cause LIMITS what a defendant answers for, and the reason is FAIRNESS — a defendant should be liable only for harm within the FORESEEABLE scope of the risks his conduct created. FORESEEABILITY is the key. STANDARD (same idea as breach): whether the injury is something a reasonable person would see as a LIKELY result of the conduct. If reasonable minds must agree, the court decides foreseeability as a MATTER OF LAW; if reasonable minds could differ, it is a JURY question.'},
      {t:'rule', n:'THREE FORESEEABILITY QUESTIONS in proximate cause (Week 12): (1) FORESEEABLE PLAINTIFF — was it foreseeable that THIS plaintiff would be harmed? (Palsgraf; the blown garbage-can-lid hitting a specific walker in a storm.) (2) FORESEEABLE RESULT / TYPE OF HARM — was this KIND of harm a foreseeable result of the risk created? (the Wagon Mound cases.) (3) FORESEEABLE EXTENT OF HARM — generally NOT required; the defendant takes the plaintiff as he finds him (eggshell rule). A related 4th issue — foreseeable INTERVENING forces — is covered in Week 13.'},
      {t:'case', n:'The Wagon Mound (No. 1 & No. 2) — FORESEEABILITY OF THE RESULT / type of harm. Oil negligently discharged from a ship spread across the harbor; it later ignited (combining with molten metal from wharf welding) and burned the plaintiff\'s dock/ships. WAGON MOUND NO. 1: the fire was held NOT foreseeable — a reasonable person would not foresee that oil would catch fire ON WATER — so NO liability (rejecting the old \'direct consequences\' Polemis rule in favor of a foreseeability test). WAGON MOUND NO. 2 (a different plaintiff, ship owner, with a fuller record): the SAME fire WAS held foreseeable → liability. Lesson (per the book): deciding what is \'foreseeable\' is not always consistent or easy; where reasonable minds could differ, it is a jury question that can go either way.'},
      {t:'rule', n:'EGGSHELL-SKULL RULE / \'TAKE YOUR PLAINTIFF AS YOU FIND HIM\' (Week 12 — foreseeability of the EXTENT of harm). The EXTENT/severity of the injury generally need NOT be foreseeable: a defendant is liable for the FULL harm even if a PRE-EXISTING condition made it worse, or the plaintiff was unusually susceptible and suffered greater harm than an ordinary person would (the \'eggshell skull/cranium\' scenario). Ex: leaving toys on the steps → Paul trips and, because of pre-existing shoulder tendonitis (or diabetes causing an infection), needs surgery/hospitalization — the defendant is liable for the full extent even though unaware of the condition.'},
      {t:'exam', n:'CRUCIAL LIMIT on the eggshell rule (Week 12): the take-him-as-you-find-him rule applies ONLY once the defendant has BREACHED a duty. The defendant\'s act must be one that would harm an ORDINARY person, OR the defendant must have known/should have known of the plaintiff\'s susceptible/pre-existing condition. It does NOT make a defendant liable for otherwise-reasonable conduct that happens to injure a fragile plaintiff. Contrast: leaving toys on the steps = a breach → liable for the aggravated shoulder injury; but a normal handshake whose fingernail scratches Paul, or a friendly back-slap that aggravates unknown tendonitis = NO breach → NOT liable (unless the defendant knew of the condition, which could itself make the harm foreseeable and the contact a breach).'},
      {t:'case', n:'Abrams v. City of Chicago, 811 N.E.2d 670 (Ill. 2004) — Mod 12 video (the video calls it "Adams," but the correct name is Abrams), foreseeability of the TYPE of harm. A woman in labor (~10-min contractions) called 911; the dispatcher declined to send an ambulance. A friend drove her, ran a red light, and was struck by a speeding driver intoxicated on alcohol and cocaine (on a suspended license); she was seriously injured and her baby died. Her estate sued the City for willful/wanton failure to send an ambulance. Held (as a matter of law): the injury was NOT a foreseeable result of refusing an ambulance — millions reach hospitals safely by private car, the City only "furnished a condition," and the two law-breaking drivers were the superseding proximate cause. Reconciled with the rule that a defendant need not foresee the exact nature/extent of injury, only that SOME injury of a generally injurious nature would result (Hart v. Curry): here the very TYPE of harm — a third-party car crash — fell outside the foreseeable scope of not dispatching an ambulance.'},
      {t:'rule', n:'⭐ Seminar 12 (Prof.) — THE FIVE-BOX TAXONOMY of proximate cause ("five places proximate cause breaks down"). Every proximate-cause problem is ONE of these five — NAME THE BOX before you state the rule: (1) unforeseeable EXTENT of injury; (2) unforeseeable MANNER of injury; (3) unforeseeable TYPE of injury; (4) unforeseeable PLAINTIFF; (5) unforeseeable INTERVENING EVENT. Boxes 1 & 2 (extent, manner) do NOT defeat liability; boxes 3, 4, 5 (type, plaintiff, intervening) CAN.'},
      {t:'rule', n:'Seminar 12 — the SYNTHESIS (say it out loud): the TYPE of harm and the PLAINTIFF must be foreseeable (these can defeat the claim); the MANNER and the EXTENT need NOT be foreseeable (they never help the defendant); an INTERVENING event = IT DEPENDS (superseding only if extraordinary). Framing: ACTUAL cause asks WHETHER the defendant caused the harm (but-for / substantial factor); PROXIMATE cause asks HOW — a policy limit that cuts off liability when the sequence is too unexpected/bizarre even though the defendant caused it in fact.'},
      {t:'rule', n:'Seminar 12 — EXTENT (box 1, eggshell) & MANNER (box 2). EXTENT: the defendant takes the plaintiff as found and is liable for the FULL extent even if greater than anticipated — BUT only if SOME injury was reasonably foreseeable to begin with (pacemaker-shock hypo: no foreseeable injury at all → nothing for the eggshell rule to enlarge). MANNER: the TYPE must be foreseeable but the precise MANNER need not (a log bouncing off pavement through a windshield still counts) — the rat-and-gasoline hypo, United Novelty Co. v. Daniels (an explosion is foreseeable; the rat that set it off need not be). Expect a fight over the LEVEL OF GENERALITY — plaintiff states the risk broadly, defendant narrowly.'},
      {t:'rule', n:'Seminar 12 — TYPE (box 3, CAN defeat the claim): the general consequence/type of harm must be reasonably foreseeable; harm of a different ORDER is not covered. Palsgraf (Cardozo) — the invaded interest was "not even of the same order"; blood-transfusion hypo (negligent failure to test for disease A, plaintiff contracts unknown disease B — actual cause met, but TYPE fails). History: common law used DIRECT causation (In re Polemis — liable for ALL directly-caused harm, foreseeable or not, now effectively gone); the MAJORITY today is reasonable foreseeability (Wagon Mound No. 1), refined by Wagon Mound No. 2 (a REMOTE risk still counts where the harm would be serious and there was no justification for running it).'},
      {t:'rule', n:'Seminar 12 — PLAINTIFF (box 4) is resolved at DUTY, not causation (Cardozo, Palsgraf): "the risk reasonably to be perceived defines the duty to be obeyed"; "the orbit of the danger… is the orbit of the duty"; "the law of causation… is foreign to the case." If the plaintiff is OUTSIDE the foreseeable zone of danger, no duty is owed and you never reach causation. ANDREWS DISSENT: everyone owes the world a duty to refrain from unreasonably risky acts, so the limit instead comes at PROXIMATE CAUSE — "expediency… a rough sense of justice," no fixed rules — his factors: but-for, a natural & continuous sequence, a substantial factor, a direct connection without too many intervening causes, effect not too attenuated, a cause likely to produce the result, foreseeability, and remoteness in time/space.'},
      {t:'rule', n:'Seminar 12 — INTERVENING EVENT (box 5): ask (a) is it an INTERVENING force at all — a NEW force arising AFTER the defendant\'s conduct that joins it to produce the injury? and (b) if so, is it so EXTRAORDINARY under the circumstances that it SUPERSEDES and cuts off liability entirely? Osborne v. Atlantic Ice & Coal — a 7-year-old jumping onto a moving truck was not foreseeable ("the law does not require omniscience"). Abrams v. City of Chicago — the City merely "furnished a condition," but the INDEPENDENT ILLEGAL acts of the drunk/drugged driver caused the harm; legal cause asks whether the injury is "of a type a reasonable person would see as a likely result."'},
      {t:'exam', n:'Seminar 12 — EXAM TIPS (proximate cause): (1) NAME THE BOX first (extent / manner / type / plaintiff / intervening) before stating any rule — it keeps you from reciting the wrong standard and earns points. (2) MANNER and EXTENT never help the defendant — when the facts turn bizarre, that\'s MANNER, and manner favors the plaintiff (Hart v. Curry). (3) On Palsgraf the ELEMENT is the question — Cardozo decides it at DUTY, Andrews at PROXIMATE CAUSE; say which and why it matters procedurally. (4) Watch MAJORITY vs. MINORITY (direct causation vs. foreseeability; Restatement 2d vs. 3d) — apply the majority unless told otherwise. (5) Don\'t be brief — overwhelming force, not just enough to lose.'}
    ]},
    { w:13, topic:'Negligence — Proximate Cause & Intervening Forces', tags:['intervening force','superseding cause','proximate cause','foreseeability','Derdiarian'], notes:[
      {t:'concept', n:'📖 Reading — Diamond & Levine §12.03[A][3] (Proximate Cause & Intervening Forces).'},
      {t:'concept', n:'An intervening force arises after the defendant\'s negligence and contributes to the harm. A foreseeable intervening force does NOT break the causal chain; an unforeseeable superseding cause does, cutting off the defendant\'s liability.'},
      {t:'case', n:'Derdiarian v. Felix Contracting Corp. (414 N.E.2d 666, N.Y. 1980) — a foreseeable intervening act does not relieve the original negligent defendant; what matters is foreseeability of the general risk, not the precise manner of harm.'},
      {t:'case', n:'Ventricelli v. Kinney System Rent A Car (383 N.E.2d 1149, N.Y. 1978) — required case: liability can fail where the intervening event made the location/timing of harm merely coincidental rather than a foreseeable result of the negligence.'},
      {t:'case', n:'Delaney v. Reynolds (825 N.E.2d 554, Mass. App. Ct. 2005) — required case (self-harm as an intervening force; foreseeability).'},
      {t:'case', n:'Medcalf v. Washington Heights Condominium Ass\'n (747 A.2d 532, Conn. App. Ct. 2000) — required case (intervening criminal act / foreseeability).'},
      {t:'exam', n:'Graded: Resource Quiz (5 pts); Essay Quiz (100 pts, 60 min); Seminar (2 pts).'},
      {t:'rule', n:'The complete foreseeability test for proximate cause has two parts: (1) a reasonably foreseeable result or type of harm, and (2) no superseding intervening force; an intervening force is a new force, arising after the defendant\'s conduct, that joins with it to cause the injury.'},
      {t:'rule', n:'A foreseeable intervening force does not cut off liability; only an intervening force characterized as superseding does, and a force is generally deemed superseding only when its occurrence appears highly improbable and extraordinary under the circumstances.'},
      {t:'concept', n:'Courts distinguish dependent intervening forces (stimulated by the defendant\'s negligence, like a rescuer\'s efforts) from independent ones (not so stimulated, like an unrelated waterskier), but this label is generally not decisive; what matters is how improbable the intervening force is.'},
      {t:'case', n:'If A negligently drops gasoline at a service station, fire is a foreseeable harm; if B then carelessly drops a match igniting it, B is an intervening but not superseding force, whereas if B intentionally drops the match the criminal arson is more likely superseding -- though it is wrong to assume negligent acts never supersede and intentional acts always do.'},
      {t:'rule', n:'Acts of nature can be superseding, but a storm or other natural force that should have been anticipated is foreseeable and not superseding even if extraordinarily strong; the Restatement finds a natural force superseding only if its operation is extraordinary and it produces a different kind of harm than made the conduct negligent.'},
      {t:'case', n:'Johnson v. Kosmos Portland Cement: the defendant negligently allowed gas to collect on a barge that was then ignited by lightning, and liability was upheld because lightning was, at that time and place, no extraordinary manifestation of natural force and thus not superseding.'},
      {t:'rule', n:'Foreseeable intervening forces that merely have slight odds of occurring are not superseding; ordinary automobile accidents and medical malpractice that aggravate the original injury have been held not superseding, because the tortfeasor who exposed the victim to such risks shares responsibility for the aggravated harm.'},
      {t:'concept', n:'Extreme intervening conduct can be superseding even when ordinary versions are not: routine malpractice in treating an injury is foreseeable, but grossly improbable malpractice such as amputating the wrong leg would likely be superseding.'},
      {t:'concept', n:'Even when an intervening intentional wrongdoing is foreseeable, the relative culpability of the intervening actor and other factors like an extended lapse of time can tip a close case toward characterizing the force as superseding and relieving the original tortfeasor.'},
      {t:'rule', n:'Restatement (Second) §442 lists disjunctive factors for whether an intervening force is superseding, including whether it brings about a different kind of harm, appears extraordinary in hindsight, operates independently of the situation the defendant created, and the degree of culpability of any third person\'s wrongful act setting it in motion.'},
      {t:'concept', n:'The \'rescue doctrine\' is a classic foreseeable intervening force: \'danger invites rescue\' (Wagner v. International Railway, Cardozo), so a defendant whose negligence imperils someone is liable to a rescuer injured in a reasonable rescue attempt, the rescue being a foreseeable, non-superseding response.'},
      {t:'exam', n:'📘 MODULE 13 STUDY GUIDE (cumulative review — intentional torts, privileges & the negligence prima facie case). EXAM METHOD: (1) Work in IRAC; establish the PRIMA FACIE TORT first, analyze any PRIVILEGE only AFTER — never before. (2) Take claims ONE PARTY PAIRING at a time (A v. B, then B v. A); resolve one direction fully before the other — do NOT merge them. (3) SEPARATE THE ACTS — one confrontation can contain several distinct volitional acts (a threat, a swing, and a charge are THREE acts, not one); analyze each act on its own elements ("run the narrative like a movie in slow motion, stop the frame on each"). (4) ARGUE BOTH SIDES where reasonableness/foreseeability/privilege-scope can go either way; state the standard, argue each side, and COMMIT to a reasoned result (credit is for the reasoning, not the outcome). (5) Use INCORPORATION BY REFERENCE — analyze a repeated privilege once, then refer back. (6) "Put yourself in the room" first — positions, distances, postures, what each hand did, objects underfoot; those easily-skipped facts usually decide an element.'},
      {t:'rule', n:'📘 Mod 13 guide — THRESHOLD (act + intent): every intentional tort starts with a VOLITIONAL act (voluntary, conscious bodily movement — a reflex/spasm is not volitional) and INTENT (purpose to cause the tortious result OR knowledge to a substantial certainty it will occur — either suffices; intent runs to the ACT element, the contact/apprehension, NOT to the harm or its extent). A mistaken belief does not negate intent and a good motive does not either — an honest/reasonable mistake is handled through the PRIVILEGES, not by defeating intent. Battery = contact, and the plaintiff need NOT be aware at the moment (extended-personal-contact: something held/worn/carried counts). Assault = reasonable apprehension of IMMINENT contact and DOES require the plaintiff\'s awareness (apprehension ≠ fear; apparent ability is enough).'},
      {t:'rule', n:'📘 Mod 13 guide — CONDITIONAL THREAT (assault) & SELF-DEFENSE nuances. Conditional threat ("do this or I\'ll strike you") is NOT automatically outside assault — ask whether the defendant was PRIVILEGED to demand the alternative: no right to demand → the condition does not save him; privileged to insist → no assault (recurring test point; either conclusion earns full credit if reasoned). SELF-DEFENSE (analyze only after a prima facie tort): reasonable belief (objective; a reasonable mistake about the need to defend does NOT defeat it) + imminent threat (force after the danger has passed = retaliation, not defense) + PROPORTIONAL force (deadly force only against death/serious-bodily-harm) + the threat must be UNPRIVILEGED (you cannot self-defend against another\'s LAWFUL defense). INITIAL AGGRESSOR ordinarily has NO privilege — regained only if the other answers with force out of all proportion. WORDS ALONE (insults/taunts) do not create the privilege. RETREAT: majority = no duty to retreat before NON-deadly force; some jurisdictions require safe retreat before DEADLY force, usually with a dwelling exception.'},
      {t:'rule', n:'📘 Mod 13 guide — PROXIMATE-CAUSE refinement (fix the sequence FIRST): an INTERVENING force is one that occurs AFTER the defendant\'s negligence and contributes to the injury; it becomes SUPERSEDING (cutting off liability) only if it was reasonably UNFORESEEABLE (ordinary responses of people/objects nearby are foreseeable and do NOT relieve the defendant). Crucial: a condition ALREADY IN PLACE before the defendant acted is NOT an intervening force, no matter what it contributed — establish WHEN each force came into existence before you label it, and address each candidate force separately. Proximate cause fails only two ways: (1) the TYPE of injury is unforeseeable (measured by general type, not precise manner or exact extent), or (2) a superseding cause.'},
      {t:'exam', n:'📘 Mod 13 guide — SELF-TEST & word discipline: address ALL FOUR negligence elements SEPARATELY (duty, breach, causation, damages) even the quick ones — an element you skip earns no credit; separate ACTUAL from PROXIMATE cause; DAMAGES require an actual loss (personal injury OR property damage) — NO nominal damages in negligence (contrast intentional torts), and a small PROVEN loss is enough (amount goes to recovery, not to whether the element is met). Word discipline the prof rewards: write "LIABLE," not "guilty," and "APPREHENSION," not "fear."'},
      {t:'rule', n:'⭐ Seminar 13 (Prof. Brown) — INTERVENING vs. SUPERSEDING (Proximate Cause Part 2, the NRG power-pole hypo). An INTERVENING force is a new force (human, animal, mechanical, natural) that arises AFTER the defendant\'s negligence and joins it to produce the injury. (If it happened FIRST it is the "set stage," not intervening — e.g., placing the pole is the stage; the car crash comes after.) An intervening force is NOT automatically fatal to the plaintiff; it only matters when it rises to a SUPERSEDING cause. Superseding "TAKES OVER" the situation and cuts off the defendant\'s liability ENTIRELY; intervening merely "HELPS ALONG." Every superseding cause starts life as an intervening one; MOST intervening acts never become superseding. "Superseding" is a CONCLUSION, not a starting point.'},
      {t:'rule', n:'Seminar 13 — THREE WAYS an intervening force becomes SUPERSEDING (only ONE is needed): (1) it was EXTRAORDINARY under the circumstances / not foreseeable in the normal course; (2) it was INDEPENDENT of what the defendant did; or (3) it was FAR REMOVED from what the defendant did. So if the later event was FORESEEABLE in the normal course, it is intervening but NOT superseding (a car leaving the road and hitting a roadside pole is foreseeable → not superseding). Foreseeability has two parts: (a) a foreseeable TYPE/result (Part 1) AND (b) the ABSENCE of a superseding force (Part 2).'},
      {t:'rule', n:'Seminar 13 — DEPENDENT vs. INDEPENDENT intervening forces (argue this to hit an 80+). A DEPENDENT intervening force is STIMULATED by the defendant\'s negligence (a reaction it prompted); an INDEPENDENT force is NOT so stimulated. Dependent forces are LESS likely to be extraordinary/unforeseeable (so less likely superseding); INDEPENDENT forces are MORE likely superseding. On the exam, identify the intervening force, then argue whether it is dependent or independent (and define both) — that is what separates a pass from a strong answer.'},
      {t:'concept', n:'Seminar 13 — WHO argues superseding, and the stakes. SUPERSEDING cause is normally the DEFENDANT\'s argument, and the payoff is TOTAL ESCAPE (100% out) — not merely a smaller share like comparative fault. (A plaintiff may argue superseding only to steer liability onto a SOLVENT co-defendant when another is judgment-proof.) Contrast: JOINT & SEVERAL liability — where joint tortfeasors cause a single INDIVISIBLE injury, each is liable for the WHOLE, so the plaintiff may collect the entire judgment from either (e.g., $30k from the driver + the balance from the deep-pocket utility). Jurisdictions split on the mechanics of superseding cause (some treat it as an affirmative defense the defendant must plead/prove; others as part of the plaintiff\'s proximate-cause burden).'},
      {t:'rule', n:'Seminar 13 — FACT vs. LAW (who decides). Foreseeability / proximate cause / whether a force is superseding are generally QUESTIONS OF FACT for the JURY; BUT-FOR (actual cause) is more a LEGAL question for the JUDGE. Appellate courts give great DEFERENCE to a jury\'s findings of fact and overturn only for a LEGAL error (e.g., a wrong jury instruction) or where no rational trier of fact could have reached the result. Tactical point: bring proximate cause to the appellate court as a QUESTION OF LAW (no deference owed) rather than re-litigating the jury\'s facts.'},
      {t:'case', n:'Seminar 13 — INTERVENING/SUPERSEDING cases. DERDIARIAN v. FELIX CONTRACTING (N.Y.): a contractor left a work site (worker sealing a gas main with a 400° kettle) protected only by a single wooden barricade next to active traffic; an epileptic driver who skipped his medication seized, crashed through the barricade, and knocked the worker into the boiling enamel. HELD: the driver\'s negligence was NOT superseding — it was foreseeable that an inadequately protected site next to a roadway risks a car entering and injuring workers; foreseeable + not independent = intervening but not superseding. VENTRICELLI v. KINNEY SYSTEM RENT A CAR (N.Y.): a defective trunk lid kept popping open; the renter pulled into a parking space to close it and was struck by another car. MAJORITY: the rental company was not the proximate cause — a collision while parked in a safe spot was not foreseeable. DISSENT (Fuchsberg): it was foreseeable, even expected, that a driver would get out to fix the lid; proximate cause is a FACT question best left to the jury. (Derdiarian = force FLOWS FROM the negligence / dependent; Ventricelli majority = it merely OPERATED ON the situation / independent.)'},
      {t:'case', n:'Seminar 13 — MEDCALF v. Washington Heights Condominium (Conn.): an intervening CRIMINAL act. A criminal attack is generally UNFORESEEABLE, so it is an intervening cause that many courts treat as SUPERSEDING (and some states, e.g., Louisiana, apply a flat no-liability rule: a property owner is not liable for third-party crimes on the premises because they are not foreseeable) — the analysis reduces to FORESEEABILITY. DELANEY v. Reynolds: self-harm as an intervening force — whether a plaintiff\'s own later act cuts off liability turns on whether that act was foreseeable.'},
      {t:'exam', n:'⭐ Resource Quiz 13 (Superseding/Intervening) — answers + why. Q1: A superseding intervening force = (a) BREAKS THE CHAIN OF CAUSATION (that is its definition - it cuts off the original tortfeasor\'s liability; it is NOT foreseeable/likely/probable). Q2: MEDCALF v. Washington Heights ruling = (c) the failure to maintain the intercom was NOT the proximate cause - the criminal attack fell OUTSIDE the foreseeable scope of the risk created by the broken intercom (a and b state the opposite; d is the losing side). Q3: intentional/criminal intervening acts = (c) they OFTEN break the chain of causation - watch the absolutes, so NOT "always" (a), NOT "never foreseeable" (b), and they do not erase ACTUAL cause (d); they are usually superseding EXCEPT where the defendant\'s very duty was to guard against that risk (negligent-security cases). Q4: an intervening force is superseding = (d) when it is EXTRAORDINARY - a foreseeable / within-the-scope-of-risk force does NOT supersede (that is the opposite test). Q5: DERDIARIAN v. Felix Contracting = (c) a JURY COULD FIND the driver\'s acts were NOT a superseding intervening force - the court refused to rule as a matter of law: the risk of a car entering an unbarricaded work site was exactly the risk the safety precautions were meant to address, and the precise MANNER of the intervening act need not be foreseeable, so proximate cause went to the jury.'},
      {t:'exam', n:'⭐ Module 13 ESSAY REVIEW (Perry / Dennis / Corey) — METHOD. Read the INTERROGATORIES (the call) FIRST by glancing to the end of the fact pattern, then map every lawsuit on scratch paper and note each one\'s FOCUS. Here three calls = three suits: (1) Perry v. Dennis (intentional torts + defenses); (2) Dennis v. Perry (intentional torts + defenses); (3) Corey v. Perry (negligence). A proper answer is a SERIES of IRAC discussions, one per discussable issue; length tracks the facts - obvious points get short treatment, the contested point gets the detail. It is IRA-C, not IRA: ALWAYS reach a conclusion; when the facts are genuinely open, either result earns full credit so long as you commit. Never write the same rule/discussion twice - INCORPORATE BY REFERENCE (any words showing you rely on the earlier discussion will do).'},

      {t:'exam', n:'Module 13 essay — LAWSUIT 2, Dennis v. Perry (ASSAULT). Analyze TWO separate instances. (A) Perry\'s CONDITIONAL THREAT to punch Dennis: the key issue is whether a conditional threat can be an assault - the model concludes it cannot, but the opposite conclusion is equally acceptable (you just MUST conclude). (B) Perry CHARGING at Dennis: intent shown by SUBSTANTIAL CERTAINTY, or alternatively by TRANSFERRED INTENT (Perry\'s intent to hit/batter transfers to the intent to assault) - either way assault is established. Then SELF-DEFENSE (rule "as defined above" - incorporate by reference): Perry\'s claim FAILS because Perry was the INITIAL AGGRESSOR and, after Dennis\'s punch, there was no sign Dennis would keep attacking.'},
      {t:'exam', n:'Module 13 essay — LAWSUIT 3, Corey v. Perry (NEGLIGENCE). State the four elements up front. DUTY - easily established, keep it short. BREACH - the meatier issue: discuss whether Perry acted UNREASONABLY; the Learned Hand formula (United States v. Carroll Towing) is ONE optional way to organize it, not required - what is essential is a factual discussion of whether he failed to act as a reasonably prudent person. CAUSATION has two sub-parts: ACTUAL cause (easy, short) and PROXIMATE cause (the detailed part). DAMAGES - Corey had no personal injury but did have PROPERTY damage ($5 to clean the stained shirt); ANY damages, however small, suffice for negligence, so Corey prevails and recovers the $5.'},

      {t:'concept', n:'Tort damages aim to make the plaintiff whole: compensatory damages (economic — medical bills, lost wages; non-economic — pain and suffering, loss of enjoyment) and, in egregious cases, punitive damages.'},

      {t:'concept', n:'Tort damages come in three forms: nominal damages (symbolic, often one dollar, given when a tort like trespass is established but no actual harm is proven), compensatory damages (to compensate for harm sustained, covering both economic and non-economic losses), and punitive damages (to punish and deter egregious conduct). Torts requiring proof of actual harm, like negligence, never support nominal damages.'},

      {t:'rule', n:'Reduction to present value: because awards for future losses (future lost earnings, medical expenses) are paid as a lump sum in advance, the award must be reduced to present value to reflect the interest the plaintiff can earn, while also accounting for future inflation. Most courts do NOT require pain and suffering awards to be reduced to present value, given their inherent imprecision.'},
      {t:'exam', n:'Per-diem arguments ARE generally permitted: plaintiffs\' attorneys may ask the jury to value pain and suffering on a per-day basis and multiply by the number of days. By contrast, \'Golden Rule\' arguments asking jurors to consider what they would demand to trade places with the victim are NOT allowed.'},
      {t:'rule', n:'Mitigation (avoidable consequences doctrine): an injured victim must act reasonably to limit losses, such as seeking appropriate medical care; if she fails, the defendant is not liable for the incremental losses that could have been avoided. This differs from contributory/comparative negligence, which goes to causing the accident; failure to wear a seat belt or helmet is sometimes treated as \'anticipatory mitigation\' folded into comparative-fault allocation.'},

function save() {

      else setSync('saved');
    });

}

function isCourses(v) { return v && typeof v === 'object' && Object.values(v).some(function(c){ return c && c.weeks; }); }

// Fold src course-map into target, deduping notes by type+text. Returns true if anything was added.
function mergeInto(target, src) {
  var changed = false;
  Object.keys(src).forEach(function(cid){
    var sc = src[cid]; if (!sc || !sc.weeks) return;
    if (!target[cid]) { target[cid] = JSON.parse(JSON.stringify(sc)); changed = true; return; }
    var tc = target[cid]; tc.weeks = tc.weeks || [];
    (sc.weeks || []).forEach(function(sw){
      var tw = tc.weeks.find(function(w){ return w.w === sw.w; });
      if (!tw) { tc.weeks.push(JSON.parse(JSON.stringify(sw))); tc.weeks.sort(function(a,b){ return a.w-b.w; }); changed = true; return; }
      var seen = {}; (tw.notes || []).forEach(function(n){ seen[n.t+'|'+n.n] = 1; });
      tw.notes = tw.notes || [];
      (sw.notes || []).forEach(function(sn){ var k = sn.t+'|'+sn.n; if (!seen[k]) { tw.notes.push({t:sn.t, n:sn.n}); seen[k] = 1; changed = true; } });
      if (sw.tags) { tw.tags = tw.tags || []; sw.tags.forEach(function(tg){ if (tw.tags.indexOf(tg) < 0) { tw.tags.push(tg); changed = true; } }); }
    });
  });
  return changed;
}

async function loadCloud() {
  if (!supa || !_session) return;
  const { data, error } = await supa.from("hub_state")
    .select("value").eq("user_id", _session.user.id).eq("key", CLOUD_KEY).maybeSingle();
  if (error) { console.error("cloud load failed", error); return; }
  const cloud = (data && isCourses(data.value)) ? data.value : null;
  courses = cloud ? cloud : JSON.parse(JSON.stringify(SEED));

  // One-time-per-device merge: fold any notes saved locally on THIS device into the shared
  // cloud copy (deduped by content) so anything added before cloud sync is never lost.
  let local = null;
  try { local = JSON.parse(localStorage.getItem('lshub_final') || 'null'); } catch(e) {}
  let didMerge = false;
  if (isCourses(local) && !localStorage.getItem('lshub_merged')) didMerge = mergeInto(courses, local);

  // Auto-merge new built-in content: when the file's SEED is updated (SEED_VERSION bumped),
  // fold any new courses/weeks/notes into the cloud copy (deduped) without touching her own additions.
  let seedMerged = false;
  if (localStorage.getItem('lshub_seedver') !== SEED_VERSION) seedMerged = mergeInto(courses, JSON.parse(JSON.stringify(SEED)));

  if (!cloud || didMerge || seedMerged) save();   // first seed, merged local notes, or merged new built-in content
  try { localStorage.setItem('lshub_merged', '1'); localStorage.setItem('lshub_seedver', SEED_VERSION); } catch(e) {}
}

function loadLocal() { // only used if the cloud library failed to load
  try {
    const d = JSON.parse(localStorage.getItem('lshub_final') || 'null');
    if (d && d.cl610 && d.cl610.weeks && d.cl610.weeks.length >= 5) courses = d;
  } catch(e) {}
}

    sendPrompt(`Based on my ${c.name} notes, can you quiz me or give me a study summary?\n\n${summary}`);
  } else {
    alert('Ask Claude feature works inside the Claude chat interface. Copy your notes and paste them into a new chat!');
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
async function afterLogin() {
  hideLogin();
  if (_session && _session.user.id === _curUid) { showApp(); return; } // already loaded this session
  _curUid = _session ? _session.user.id : null;
  await loadCloud();
  showApp();
  goHome();
  setSync('saved');
}

async function init() {
  if (!supa) { // cloud library didn't load — fall back to local-only so the app still works
    loadLocal(); hideLogin(); showApp(); renderHome(); return;
  }
  supa.auth.onAuthStateChange(function(_e, sess){
    _session = sess || null;
    if (_session) afterLogin(); else showLogin();
  });
  const s = await supa.auth.getSession();
  _session = (s && s.data) ? s.data.session : null;
  if (_session) afterLogin(); else showLogin();
}

init();
</script>
