      {t:'case', n:'Oglebay Norton Co. v. Armco (Mod 3 video): A long-term contract\'s price-setting mechanism broke down; the court resolved the apparent indefiniteness by weighing THREE reference points — what the parties set at FORMATION, their COURSE OF PERFORMANCE over decades (1957–1983), and the 1984 breakdown. Lesson: a term that looks fatally indefinite on its face can be rendered definite by the parties\' actual CONDUCT — course of performance (this contract) and course of dealing (prior contracts) — showing what they meant.'},
      {t:'case', n:'Southwest Engineering Co. v. Martin Tractor Co. (Kan. 1970, 205 Kan. 684) — OPEN TERMS under the UCC. Negotiations over a standby generator produced a signed memo fixing the equipment and price but leaving payment terms open. HELD: under the UCC (§§2-204, 2-310) a contract does not fail merely because terms like payment are left open, if the parties intended to contract and there is a reasonably certain basis for a remedy; the signed memo satisfied the SOF and the open payment term is filled by the Code gap-filler.'},
      {t:'case', n:'Copeland v. Baskin-Robbins U.S.A. (Cal. App. 2002, 96 Cal.App.4th 1251) — CONTRACT TO NEGOTIATE in good faith. Baskin-Robbins agreed to sell Copeland a plant and to co-pack products, but the co-packing terms were left for later negotiation, which broke down. HELD: an agreement to NEGOTIATE in good faith is enforceable, but the remedy is limited to RELIANCE damages, not expectation/lost profits. A bare "agreement to agree" is not a binding contract.'}
    ]},
    { w:4, topic:'Advertisements as offers, acceptance of unilateral offers & revocation', tags:['advertisement','unilateral contract','bilateral contract','acceptance','revocation','Carlill','Leonard v. Pepsico','Petterson v. Pattberg'], notes:[
      {t:'concept', n:'📖 Reading — Ferriell §§4.04, 4.05, 4.08[A]. Required cases (read in groups): Group 1 — Broadnax v. Ledbetter; MCC-Marble Ceramic v. Ceramica Nuova d\'Agostino; Carlill v. Carbolic Smoke Ball; Leonard v. Pepsico. Group 2 — Day v. Caton; Wilhoite v. Beck; Miller v. NBD Bank. Group 3 — 39 U.S.C. §3009; Hobbs v. Massasoit Whip; Petterson v. Pattberg; Brackenbury v. Hodgkin; Motel Services v. Central Maine Power.'},
      {t:'exam', n:'📋 Module 4 (Acceptance): Graded — Resource Quiz (11 pts); Seminar (2 pts).'},
      {t:'concept', n:'Bilateral: exchange of promises. Unilateral: promise for an act — acceptance occurs only upon completion of performance, not by promising to perform.'},
      {t:'rule', n:'Advertisements are generally invitations to deal, not offers. Exception: reward-style ads that are specific, definite, and leave nothing open for negotiation = unilateral offers to anyone who performs the stated conditions.'},
      {t:'case', n:'Carlill v. Carbolic Smoke Ball Co., 1 Q.B. 256 (1893): Ad promising £100 to anyone who used product as directed and caught flu = unilateral offer. Carlill accepted by performing the stated conditions (using product, catching flu).'},
      {t:'rule', n:'When offeror specifies the manner of acceptance, offeree must comply with that specified manner. Attempting to accept differently = not a valid acceptance.'},
      {t:'case', n:'Leonard v. Pepsico, 88 F.Supp.2d 116 (S.D.N.Y. 1999): Harrier Jet TV ad was not a valid offer — humorous commercial. Catalog was the specified acceptance mechanism and did not list the jet.'},
      {t:'rule', n:'Revocation: offer can be revoked any time before acceptance. Exception (majority): once unilateral performance begins, offer becomes irrevocable for reasonable time. Exception (minority): bilateral contract formed on beginning performance.'},
      {t:'case', n:'Petterson v. Pattberg, 248 N.Y. 86 (1928): Mortgage discount offer validly revoked before May payment was tendered — revocation came before acceptance.'},
      {t:'exam', n:'Ad analysis: general ad = invitation to deal. Reward/specific ad = unilateral offer; accepted by performing conditions. Humor/absurdity = signal no reasonable person would treat as serious offer.'},
      {t:'concept', n:'📖 Module 4 reading: Contracts Ch. 4 §§4.04–4.05 (Acceptance & Manner of Acceptance) and §4.08[A] (Termination of offers — lapse). [Note: §4.04[B] who-can-accept and §4.05[A]–[B] manner-of-acceptance basics are also part of this reading but their full notes are in Week 2 / Module 2.]'},
      {t:'concept', n:'§4.04 Acceptance: an offer creates a \'power of acceptance\' in the offeree (Hohfeld\'s term). A contract forms when the offeree manifests assent within the time and manner the offer requires. Acceptance is judged by the OBJECTIVE theory — outward manifestations, not secret intent. (Sam offers his car for $16,000 and Barb says \'I\'ll take it\' as a joke — if Sam reasonably thought she was serious, there\'s a contract. \'I don\'t want that hunk of junk\' is a rejection even if she secretly meant to buy.)'},
      {t:'rule', n:'§4.04[A] Acceptance must be UNEQUIVOCAL: an offeree who expresses doubt (\'I might agree to that\') has not accepted. A clear yes (\'that\'s a fair price, I want you to build it\') is acceptance; manifested reluctance (\'I want it, but $60,000 is too high\') is not.'},
      {t:'rule', n:'§4.04[A][1] Grumbling acceptance is EFFECTIVE: an acceptance that complains but still agrees (\'I really thought I could get a better price, but all right, build it\') forms a contract. A grumble is still a yes.'},
      {t:'rule', n:'§4.04[A][2] Conditional acceptance is INEFFECTIVE: a reply that makes assent depend on new or added terms (\'I accept, but only if you finish within three months\') is NOT an acceptance — it is a counteroffer. BUT if the added term only makes explicit what was already IMPLIED (\'only if you finish within a reasonable time\'), it is still an acceptance. A mere request or inquiry about changing terms does not destroy an otherwise unequivocal acceptance.'},
      {t:'concept', n:'Mirror-image rule (common law): a purported acceptance that adds or changes terms is not a \'mirror image\' of the offer, so it is a counteroffer, not an acceptance. UCC Article 2 (§2-207) makes major inroads on this for sales of goods. (Under the CISG, additional/limiting/modifying terms = rejection + counteroffer; immaterial differences can still form a contract unless the offeror promptly objects — and the CISG treats price, payment, quality, quantity, delivery, liability, and dispute-settlement terms as MATERIAL.)'},
      {t:'rule', n:'§4.05[C] Notice of acceptance: acceptance generally must be communicated, but the offeror need not actually RECEIVE it — a reasonable effort to notify usually suffices, and a mailed acceptance is effective when sent (mailbox rule). Where acceptance is by beginning performance in the offeror\'s plain view, the performance itself gives notice; but separate notice IS required if the offeror asked for it or the offeree has reason to know the offeror won\'t otherwise learn of performance (Restatement §54). Some offers (reward offers like Carlill; guaranty offers) dispense with notice by their nature.'},
      {t:'rule', n:'§4.05[D] Silence as acceptance: silence is normally NOT acceptance, and an offeror cannot declare \'your silence = acceptance\' to trap an offeree. Exceptions: (1) accepting the benefit of services with a chance to refuse and reason to know payment is expected (Day v. Caton — party wall); (2) a prior course of dealing gives silence meaning (Hobbs v. Massasoit Whip — silent retention of eel skins after repeated past dealings was acceptance); (3) negative-option plans the offeree expressly agreed to (book/wine/coffee clubs).'},
      {t:'concept', n:'Unsolicited merchandise & silence: silently keeping unordered goods can look like acceptance, but federal law (39 U.S.C. §3009) lets a consumer treat unsolicited merchandise sent by mail as a GIFT — keep it and owe nothing. Silence CAN accept a modification of an existing contract (Raasch v. NCR — continued work under a new handbook containing an arbitration clause).'},
      {t:'concept', n:'§4.05[E] Means of communicating acceptance: assent may be given by any reasonable method (letter, phone, email, text) unless the offer expressly limits it. The medium used to send the offer is presumptively a reasonable medium for acceptance, but the offeree is not limited to it (reasonableness turns on speed, reliability, trade custom, and course of dealing). Automated acceptances by \'electronic agents\' are valid under UETA and the federal E-Sign Act; EDI master agreements govern recurring electronic orders.'},
      {t:'rule', n:'§4.05[F] Final written contract & \'letters of intent\': when parties orally agree intending to sign a formal writing later, the question is whether signing the writing was a CONDITION of formation (no deal yet) or just a convenient memorialization (already bound). Factors (Restatement §27): (1) is this type of deal usually put in writing? (2) how many details remain open? (3) the size of the transaction; (4) did performance begin before signing? (5) did the parties say they wouldn\'t be bound until a writing? (International Castings Group v. Premium Standard Farms — emails showed a binding deal; the writing was a mere memorial.)'},
      {t:'rule', n:'§4.05[G] Assent to standardized/adhesion form contracts: terms in a signed (or \'I agree\'-clicked) standardized form are generally enforceable where the party assents and has reason to know like writings carry such terms (Restatement §211(1)) — EXCEPT a term the drafter has reason to know the party wouldn\'t have agreed to if she knew of it (§211(3)). Courts scrutinize adhesion terms three ways: (1) reasonable opportunity to read/understand; (2) reasonable expectations; (3) unconscionability.'},
      {t:'concept', n:'§4.05[G][1] Opportunity to read (online contracts): the traditional rule is you\'re bound by what you sign whether or not you read it. Online, the question is whether the party had REASONABLE NOTICE and a chance to review before assenting — conspicuousness and context are key. Unenforceable: Specht v. Netscape (arbitration term below the visible screen, no notice); Cullinane v. Uber and Nicosia v. Amazon (terms not conspicuous). Enforceable: clear clickwraps (Forrest v. Verizon; Caspi v. Microsoft). \'Money now, terms later\' with a right to return can be valid.'},
      {t:'case', n:'§4.05[G][2] Reasonable-expectations doctrine (originated in insurance): the agreement is read to match the customer\'s reasonable expectations even if the fine print conflicts. C&J Fertilizer v. Allied Mutual — a \'burglary\' definition requiring visible marks of forced entry went beyond the insured\'s reasonable expectations and was not enforced. Broemmer v. Abortion Services of Phoenix — an arbitration clause fell outside a stressed, unsophisticated patient\'s reasonable expectations and was unenforceable.'},
      {t:'concept', n:'§4.05[G][3] Unconscionability (the third screen): denies enforcement where there was an absence of meaningful choice PLUS terms unreasonably favorable to the other party (Williams v. Walker-Thomas Furniture) — generally requires BOTH procedural and substantive unfairness. It goes further than reasonable expectations because it can strike down even an expected term that is grossly unfair.'},
      {t:'rule', n:'§4.05[H] Rolling (\'money now, terms later\') contracts: terms delivered AFTER purchase (inside the box, or at install) can still bind if the buyer had notice and a right to return for a refund after reviewing them. ProCD v. Zeidenberg (Easterbrook) — shrinkwrap \'noncommercial use\' license enforced; acceptance occurred by USING the software after a chance to read the license. Hill v. Gateway — an arbitration term in the computer box bound the phone buyer. Contra: Klocek v. Gateway and Specht — applied §2-207 or found no reasonable notice, so the late terms were mere proposals. The 2022 Restatement of Consumer Contracts §2 would bind late terms only with advance notice, a chance to review, and a chance to cancel without unreasonable cost.'},
      {t:'concept', n:'§4.08 Termination of the power of acceptance: a contract forms only if acceptance happens BEFORE the offer terminates. An offer can end by (1) lapse, (2) revocation, (3) rejection, (4) counteroffer, or (5) death or incapacity of the offeror.'},
      {t:'rule', n:'§4.08[A] Lapse (expiration of time to accept): as master of the offer, the offeror sets how long it lasts, and a stated time controls. If none is stated, the offer lasts a REASONABLE time (depends on prior dealings, trade custom, and market volatility — a volatile market means a short window). In face-to-face or phone talks the power of acceptance usually ends when the conversation ends, unless extended (\'think about it and get back to me\'). A mailed acceptance is timely if sent by midnight of the day the offer is received (a safe harbor, not a hard deadline). A lapsed offer can be revived by repeating it — but a mere rebroadcast does not revive it (Newman v. Schiff — a tax protester\'s $100,000 offer made on a live TV show was not revived by a later taped rerun).'},
      {t:'concept', n:'Acceptance basics — the offeree\'s perspective (Mod 4 video, Broadnax v. Ledbetter): Acceptance is the offeree exercising the POWER OF ACCEPTANCE the offer created — at its most basic, saying "yes" to the offered terms WITH intent to form a contract, which is the moment a contract forms and the terms are fixed. The power of acceptance requires the offeree to KNOW about the offer — you cannot accept an offer you never knew existed (Broadnax v. Ledbetter). Analytical benchmark: identify the "roadmap for acceptance" the offeror built into the offer, then measure the offeree\'s actions against that standard. MCC-Marble Ceramic lesson: if you want a term in the deal, make sure it is actually IN the signed writing before you sign.'},
      {t:'rule', n:'DEAD MAN statutes (Mod 4 video, Wilhoite v. Beck / Miller v. NBD Bank): When a claimant sues an estate over an alleged agreement with the deceased (e.g., decades of room, board, and care — was it gratuitous or with expectation of payment?), a Dead Man statute BARS the claimant from testifying to the conversations/statements of the deceased — it stops a party from putting self-serving words in the mouth of someone who can no longer rebut or confirm them. That forces the fact-driven, presumption-weighing analysis in Wilhoite (degree of kinship, the parties\' relationship and conduct over the years). The court\'s detailed fact analysis there models the DEPTH expected in a fact-driven essay/exam answer.'},
      {t:'rule', n:'Accepting a UNILATERAL offer — traditional vs modern (Mod 4 video): The problem — acceptance of a unilateral offer occurs only on COMPLETING performance, so what if the offeror revokes mid-performance (patio half-built)? TRADITIONAL rule (Petterson v. Pattberg) — incomplete performance = no acceptance = the offer can still be revoked, and any recovery for work already done is NOT under contract (no contract ever formed). MODERN MAJORITY (Brackenbury v. Hodgkin) — once the offeree BEGINS the requested performance, the offer becomes irrevocable and the offeror must hold it open a reasonable time to allow completion; on completion, a contract forms. Motel Services v. Central Maine Power adds: once performance begins, the offeror also cannot ALTER the offer or add terms/conditions not in the original. (Mere PREPARATION is not enough; "reasonable time" is a context-driven, fact-specific question.)'},
      {t:'rule', n:'LAPSE with mailed offers — computing the deadline (Mod 4 video): (1) Offer open for a period measured "after receipt" ("24 hours after you receive this") → the clock runs from ACTUAL receipt, regardless of mail delay (received May 10 → accept by May 11). (2) Offer with a fixed CALENDAR deadline ("accept by May 4") that is DELAYED in the mail → take the time you WOULD have had with normal delivery and add it to the actual receipt date (dated May 3, normally arriving May 4 = 1 day; delayed to May 10 → you have until May 11). (3) Offer SILENT on duration → open for a REASONABLE time, judged by context (perishable vine-ripened tomatoes = short; cinder blocks = longer but still limited; a year later is never reasonable). Same approach under both the common law and the UCC.'}
    ]},
    { w:5, topic:'Acceptance — rejection, counter-offers & UCC 2-207 Battle of the Forms', tags:['acceptance','rejection','counter-offer','UCC 2-207','battle of the forms','mirror image rule','merchants','Diamond Fruit Growers','Dorton v. Collins'], notes:[
      {t:'concept', n:'📖 Reading — Ferriell §§4.08[B–E], 4.09, 4.10. Required cases & statutes: Dorton v. Collins & Aikman; UCC §2-207; Diamond Fruit Growers v. Krack; Fujimoto v. Rio Grande Pickle; ProCD v. Zeidenberg. (Optional: Swift & Co. v. Smigel; Hill v. Gateway 2000; Klocek v. Gateway.)'},
      {t:'exam', n:'📋 Module 5 (Revocation of the Offer): Graded — Discussion (10 pts); Resource Quiz (10 pts); Seminar (2 pts).'},
      {t:'concept', n:'Module 5 focus: Mutual Assent — specifically acceptance. Full Contracts flowchart: Formation → Mutual Assent (Offer + Acceptance) → Consideration → Bargained-for Exchange → Defenses to Formation → Promissory Estoppel → Restitution/Quasi-Contract.'},
      {t:'rule', n:'Rejection: A rejection terminates the offer — the offeree loses the power of acceptance. A later attempt to "accept" is NOT acceptance; it is a new offer from the original offeree. Hypo: Ann offers Betty a watch at 50% discount. Betty says no (rejection → offer terminated). Betty then says "I changed my mind, yes." Betty has NOT accepted — she has made a new offer to Ann.'},
      {t:'rule', n:'Counter-offer: A response proposing different or additional terms. Under common law mirror image rule: (1) operates as a rejection of the original offer, and (2) creates a new offer from the original offeree. The original offeror now has the power of acceptance.'},
      {t:'rule', n:'Mirror Image Rule (common law): Acceptance must be the precise mirror of the offer — identical terms, nothing added, nothing changed. Any variance = counter-offer and rejection of the original offer. The original offer cannot be revived.'},
      {t:'rule', n:'UCC § 2-207 (Battle of the Forms) — Overview: The UCC rejects the mirror image rule. A definite and seasonable expression of acceptance operates as acceptance even if it states additional or different terms — UNLESS acceptance is expressly made conditional on assent to the new terms. If expressly conditioned → no contract on documents → look to parties\' conduct under § 2-207(3).'},
      {t:'rule', n:'UCC § 2-207(2) — Additional terms between merchants: When both parties are merchants, additional terms in the acceptance automatically become part of the contract UNLESS one of three exceptions: (1) Ironclad offer — original offer expressly limits acceptance to its own terms. (2) Material alteration — the additional terms materially alter the contract (significantly change risk or burden). (3) Objection — offeror has already objected or objects within a reasonable time.'},
      {t:'rule', n:'UCC § 2-207(2) — Non-merchants: When at least one party is NOT a merchant, additional terms in the acceptance do NOT automatically become part of the contract. They are mere proposals requiring the offeror\'s express assent.'},
      {t:'rule', n:'UCC § 2-207(3) — Contract by conduct: If no contract is formed on the documents (acceptance expressly conditioned on new terms AND offeror did not agree), a contract may still exist from the parties\' conduct. Terms = (1) terms on which both writings agree + (2) UCC gap-filler provisions.'},
      {t:'case', n:'Diamond Fruit Growers, Inc. v. Krack Corp., 794 F.2d 1440 (9th Cir. 1986): Metal-Matic\'s acknowledgment stated acceptance was "expressly conditional" on Krack accepting Metal-Matic\'s disclaimer. Krack objected but parties continued doing business. Held: Because acceptance was expressly conditioned on new terms, § 2-207(1) did not form a contract on documents. Contract formed by conduct under § 2-207(3) — terms limited to those on which both writings agreed; disclaimer NOT part of the contract. Key rule: expressly conditioned acceptance + offeror non-agreement → conduct analysis under § 2-207(3).'},
      {t:'case', n:'Dorton v. Collins & Aikman Corp., 453 F.2d 1161 (6th Cir. 1972): Collins\'s acknowledgment added an arbitration clause. Dorton argued it was not bound. Held: Both parties were merchants; arbitration clause was an additional term (not expressly conditioned) → § 2-207(2) applied. Remanded to determine if arbitration clause materially altered the contract. Key rule: between merchants, new terms generally become part of the contract under § 2-207(2) — unless one of the three exceptions applies.'},
      {t:'exam', n:'UCC 2-207 two-question flowchart: Q1 — Is this a definite and seasonable expression of acceptance? YES → contract formed on documents; go to Q2. Expressly conditioned on new terms → NO contract on documents → § 2-207(3) conduct analysis (terms = overlap of both writings + UCC gap-fillers). Q2 — Are both parties merchants? YES → additional terms automatically part of contract UNLESS: (a) ironclad offer, (b) material alteration, or (c) objection. NO → additional terms are proposals only; require offeror\'s express assent.'},
      {t:'exam', n:'Seminar 5 summary: (1) Rejection terminates offer — later "acceptance" is a new offer. (2) Counter-offer rejects original offer and creates a new one. (3) Common law: mirror image rule — any variance = counter-offer. (4) UCC § 2-207: acceptance valid even with new terms — the UCC does NOT follow the mirror image rule. (5) Between merchants: new terms go in automatically subject to three exceptions. (6) Expressly conditioned acceptance → no contract on documents → § 2-207(3) conduct analysis.'},
      {t:'rule', n:'Revocation by the offeror (Mod 5 video): The offeror is master of the offer and may revoke any time BEFORE acceptance, taking away the offeree\'s power of acceptance. Two forms: EXPRESS (words: "I revoke") or IMPLIED/by conduct. A revocation is effective on RECEIPT — the basic rule for ALL business communications (offers, rejections, counteroffers, modifications are effective on receipt; only ACCEPTANCE is effective on dispatch under the mailbox rule). So there is a WINDOW: the power of acceptance begins when the offer is received and ends when the revocation is received — an acceptance sent inside that window forms a contract even if the offeror had already mailed a revocation the offeree has not yet gotten.'},
      {t:'rule', n:'Revoking a PUBLIC offer (Mod 5 video): A reward-style public offer (e.g., a lost-dog flyer on a utility pole) is revoked by giving the revocation the SAME publicity in the SAME medium in which the offer was made (post the revocation on the same pole). If that same medium is no longer available, any other reasonable publicity/medium that would reach the offerees suffices.'},
      {t:'rule', n:'Revocation by CONDUCT (Mod 5 video): An offer is revoked by conduct when the offeror does an act inconsistent with performance AND the offeree learns of it from a RELIABLE source. Example: I offer to sell you my car; before you accept, our mutual friend tells you he bought that car from me this morning. The offer is revoked by conduct — you now know I cannot perform, so your power of acceptance is gone (and since no contract formed, there is no remedy).'},
      {t:'rule', n:'FOUR irrevocable offers — offers the offeror CANNOT freely revoke (Mod 5 video): (1) OPTION contract; (2) EQUITABLE option (implied option from reliance); (3) MERCHANT\'S FIRM OFFER (UCC only); (4) an offer for a UNILATERAL contract once performance has begun. Outside these four, the general rule controls — the offeror may revoke any time before acceptance.'},
      {t:'rule', n:'(1) OPTION contract (Mod 5 video, Beall v. Beall): A separate SIDE contract in which the offeree PAYS the offeror to hold the offer open for an agreed time (e.g., $3,000 to keep a $200,000 house offer open 30 days). The underlying offer is the option\'s subject matter; the option fee is its price; CONSIDERATION is required. During the option period the offeror cannot revoke or sell elsewhere. The MAILBOX RULE does NOT apply to an option — the option\'s own terms control the effectiveness of acceptance (the acceptance must be RECEIVED within the period).'},
      {t:'rule', n:'(2) EQUITABLE option (Mod 5 video): An IMPLIED option arising when the offeree relies on the offer detrimentally, reasonably, and foreseeably — the offer must then stay open a reasonable time. Classic setting: a general contractor uses a subcontractor\'s bid (an offer) to compute its master bid; that reasonable, foreseeable reliance makes the sub\'s bid irrevocable for a reasonable time so the GC can submit and the owner can decide. If the sub tries to withdraw after the GC has relied but before the owner awards the job, the sub is bound.'},
      {t:'rule', n:'(3) MERCHANT\'S FIRM OFFER — UCC §2-205 (Mod 5 video): A MERCHANT who, in a SIGNED WRITING, states the offer will be held open for a stated time cannot revoke it during that time — NO consideration required (the merchant\'s signed word is enough). Only a merchant can make one; mailbox rule does NOT apply (its terms control acceptance). THREE differences from an option: (a) an option can be given by anyone, a firm offer only by a merchant; (b) an option lasts as long as agreed, a firm offer as agreed but NOT more than 90 days; (c) an option needs consideration, a firm offer needs only the signed writing. (A non-merchant\'s signed "held open" writing is still revocable unless supported by consideration — which would make it an option.)'},
      {t:'concept', n:'Who is a MERCHANT? — three ways (UCC, Mod 5 video): (1) one who DEALS in goods of the kind involved (run a lumberyard → merchant for building materials); (2) one who by occupation has KNOWLEDGE/expertise about the goods (a plumber buying plumbing supplies is a merchant even when buying as a consumer for his own home); (3) one who employs an AGENT meeting test (1) or (2). The OCCASIONAL sale does NOT make you a merchant (selling a couch on Craigslist, or an annual yard sale, ≠ merchant).'},
      {t:'rule', n:'(4) UNILATERAL offer once performance BEGINS (Mod 5 video): Modern MAJORITY rule (rejecting Petterson v. Pattberg) — once the offeree begins the requested performance, the offer becomes irrevocable and the offeror must hold it open a reasonable time to allow completion. Mere PREPARATION to perform is NOT enough (buying the paving stones and even hiring workers for the patio job does not lock in the offer); the offer becomes irrevocable only when the offeree actually COMMENCES the requested act. (Preparation is on the offeree\'s own time and money.)'},
      {t:'rule', n:'Termination of an offer by OPERATION OF LAW (Mod 5 video): Three events, occurring after the offer but before acceptance, AUTOMATICALLY terminate the offer and cut off the power of acceptance so no contract can form — no act or notice by the parties needed: (1) DEATH or INCAPACITY of EITHER the offeror or the offeree (a valid offer needs a living party with capacity on both sides); (2) SUPERVENING ILLEGALITY — a new statute, regulation, or court decision makes the proposed performance illegal (a law banning the sale of the item terminates any pending offer to buy/sell it); (3) DESTRUCTION of the specific SUBJECT MATTER (the identified house burns down before acceptance — performance is now impossible).'},
      {t:'rule', n:'UCC §2-206 — how to accept an offer for GOODS (Mod 5 video, three-step): (1) If the offer UNAMBIGUOUSLY indicates (by language or circumstances) only ONE way to accept, that is the only way. (2) Otherwise the offer may be accepted in ANY manner and by ANY medium reasonable under the circumstances — the same medium the offer used OR any faster/at-least-as-reliable one (a mailed offer may be accepted by mail, phone, or email; at a distance, mail is always reasonable unless the offer says otherwise). (3) Where it is unclear whether a bilateral (promise) or unilateral (performance) acceptance is called for, the offeree may accept EITHER by promising OR by performing. Overarching UCC theme: find a contract wherever the parties\' words/conduct show an intent to contract.'},
      {t:'rule', n:'UCC §2-207 — ADDITIONAL vs DIFFERENT terms (Mod 5 video): An ADDITIONAL term is one NOT present in the offer at all (offer = 1,000 chickens at market; acceptance adds "pick up May 9"). A DIFFERENT term CHANGES a term that WAS in the offer (offer said "pick up May 9"; acceptance says "May 10"). The distinction matters between merchants and determines which rule governs the new term (the additional-terms rule vs the knockout rule).'},
      {t:'rule', n:'UCC §2-207 — KNOCKOUT RULE for DIFFERENT terms between merchants (Mod 5 video): MAJORITY rule — conflicting (different) terms in the offer and acceptance cancel each other out; BOTH drop out and the contract consists of the terms the writings AGREE on, with the gap filled by UCC GAP-FILLERS (e.g., a reasonable time/place for delivery). MINORITY rule — treat a different term just like an additional term under §2-207(2) (it comes in between merchants unless ironclad offer, material alteration, or objection). Reminder on ADDITIONAL terms between merchants: automatically in UNLESS (a) the offer expressly limits acceptance to its own terms, (b) the term MATERIALLY alters the contract (e.g., stripping out shipping cost that was always included), or (c) the offeror OBJECTS within a reasonable time — read as not more than 10 days after receiving the term.'},
      {t:'rule', n:'UCC §2-206 — acceptance by PERFORMANCE & NON-CONFORMING goods (Mod 5 video): An offer to buy goods can be accepted by SHIPPING the goods (no separate promise needed). Shipping CONFORMING goods = acceptance. Shipping NON-CONFORMING goods (the wrong goods) is ALSO an acceptance — it forms the contract AND simultaneously BREACHES it (acceptance and breach in one act); the buyer is entitled to the terms of its ORIGINAL offer, not the goods actually sent. EXCEPTION — the ACCOMMODATION: if the seller ships non-conforming goods WITH NOTICE that they are sent as an accommodation ("out of Rhode Island Reds — let me know if you can use these Plymouth Rocks"), it is NOT an acceptance but a COUNTEROFFER the buyer may accept (keep and pay) or reject (send back → no contract, no breach, and the buyer\'s original offer stays open, unaccepted).'}
    ]},
    { w:6, topic:'Acceptance timing, consideration & pre-existing duty rule', tags:['mailbox rule','consideration','bargained-for exchange','legal detriment','pre-existing duty rule','past consideration','Cantu v. CEA','Hamer v. Sidway','Angel v. Murray'], notes:[
      {t:'concept', n:'📖 Reading — Ferriell §§2.01–2.03, §§2.05–2.08; §4.06, §4.09[A], §4.09[D]. Required cases: Cantu v. Central Education Agency; Hamer v. Sidway; Kirksey v. Kirksey; Gottlieb v. Tropicana; Fiege v. Boehm; Schwartzreich v. Bauman-Basch; Angel v. Murray. (Optional: Ardente v. Horan; Beall v. Beall; Kim v. Son; Pennsy Supply v. American Ash.)'},
      {t:'exam', n:'📋 Module 6 (Consideration): Graded — Resource Quiz (19 pts); Essay Quiz (50 pts, 30 min); Seminar (2 pts).'},
      {t:'rule', n:'Mailbox Rule (Cantu v. Central Education Agency): An acceptance, by any medium reasonable under the circumstances, is effective upon dispatch — not upon receipt. Once sent by a reasonable medium, the acceptance forms the contract immediately, even if the offeror never receives it or sends a revocation that crosses in the mail.'},
      {t:'case', n:'Cantu v. Central Education Agency, 884 S.W.2d 565 (Tex. App. 1994): Cantu submitted her resignation on Aug. 17. The school mailed an acceptance of the resignation on Aug. 20. On Aug. 21 — before receiving the acceptance letter — Cantu tried to withdraw her resignation. Held: Under the mailbox rule, the school\'s acceptance was effective on Aug. 20 when it was dispatched. Cantu\'s attempted withdrawal on Aug. 21 came too late — the contract (accepting her resignation) was already formed.'},
      {t:'exam', n:'Mailbox rule exam application: Acceptance effective on DISPATCH. Revocation effective on RECEIPT. So: if offeree mails acceptance Monday and offeror mails revocation Tuesday, a contract was formed Monday — revocation is too late even though offeror sent it before knowing of the acceptance. The mailbox rule does NOT apply to revocations, rejections, or counter-offers — only acceptances.'},
      {t:'rule', n:'Consideration defined: Consideration is a bargained-for exchange where all parties incur a legal detriment. Two requirements: (1) Bargained-for — the consideration must be sought by the promisor in exchange for their promise, and given by the promisee in exchange for that promise. (2) Legal detriment — each party must give up something of legal value (a right they had) or do something they were not previously obligated to do.'},
      {t:'concept', n:'Past consideration is NOT valid consideration: If the act or promise was already performed before the new promise was made, it cannot serve as consideration for that new promise. Consideration must be given in exchange for the promise — not given before the promise was even made. Example: Fran mowed Ed\'s lawn as a favor before seeing his email offering $10. When she later reads the email, she cannot enforce it — her performance was not given in exchange for his promise (she did not even know about the promise when she mowed).'},
      {t:'concept', n:'Third-party consideration: Consideration can come from a third party rather than the promisee, as long as it was bargained for. Example: Seth promises to sell Bob a car if Paul pays Seth $10,000. Paul pays. Seth must deliver the car to Bob — Paul\'s payment to Seth is valid consideration for Seth\'s promise to Bob, even though Bob (the promisee) did not personally provide the consideration.'},
      {t:'concept', n:'Pre-existing legal duty: A promise to do something you are already legally obligated to do is NOT valid consideration. You are giving up nothing — no legal detriment. Example: a police officer cannot collect a reward for apprehending a criminal, because the officer is already legally required to do so. The officer gave up no legal right and incurred no new legal detriment in performing the act.'},
      {t:'case', n:'Hamer v. Sidway, 124 N.Y. 538 (N.Y. 1891) — Seminar 6 focus: Uncle promised nephew $5,000 if nephew refrained from drinking, smoking, swearing, and gambling until age 21. Nephew complied. Uncle\'s estate refused to pay. Held: A waiver of any legal right at the request of another party is sufficient consideration for a promise. The nephew had the legal right to drink, smoke, swear, and gamble — giving up those rights at his uncle\'s request was a legal detriment and valid consideration.'},
      {t:'rule', n:'Pre-existing Duty Rule (common law): Under common law, a promise to perform a pre-existing contractual duty is not valid consideration for a contract modification. If Party A already has a contract with Party B to do X, and Party A later demands more money to do X, Party B\'s promise to pay more is unenforceable — Party A gave up nothing new. New consideration is required to modify a contract under common law.'},
      {t:'rule', n:'Exception to the Pre-existing Duty Rule — Angel v. Murray test: A pre-existing duty CAN support a contract modification if ALL FOUR of the following are met: (1) The parties mutually agree to the modification. (2) The modification is made before the contract is fully performed. (3) The underlying circumstances prompting the modification were unanticipated by the parties at the time of original contracting. (4) The modification is fair and equitable in light of the unanticipated circumstances.'},
      {t:'case', n:'Angel v. Murray, 322 A.2d 630 (R.I. 1974): Maher had a five-year trash removal contract with the city. Mid-contract, he requested and received an additional $20,000 due to an unanticipated increase in the number of housing units he had to service. Held: The modification was enforceable — it met all four Angel v. Murray criteria. The increased housing units were genuinely unanticipated; the request was made before full performance; both parties mutually agreed; and the additional payment was fair and equitable given the changed circumstances.'},
      {t:'exam', n:'Consideration exam checklist: (1) Was there a bargained-for exchange? (gift/gratuitous promise = no consideration). (2) Did each party incur a legal detriment? (3) Is this past consideration? (performance before the promise = not valid). (4) Is this a pre-existing duty? (already obligated = no detriment = no consideration). (5) If contract modification: common law requires new consideration UNLESS the Angel v. Murray four-part exception applies. (6) Third-party consideration: valid if bargained-for, even if promisee did not personally supply it.'},
      {t:'exam', n:'Seminar 6 conclusion summary: (1) Mailbox rule — acceptance effective on dispatch by a reasonable medium. (2) Consideration = bargained-for exchange + legal detriment by all parties. (3) Common law contract modifications require new consideration. (4) Pre-existing duty = no legal detriment = no valid consideration — unless Angel v. Murray four-part test is satisfied (mutual agreement, before full performance, unanticipated circumstances, fair and equitable).'},
      {t:'grade', n:'Graded Essay — Mod 6, Question 1 (Score: 30/50). Fact pattern: Basin’s sponsored ad offered to remove, deliver, and install an in-stock bathroom sink for $500 over its ‘Basement Best’ discount price (a dozen models, each with name and price, shown below). Ana emailed asking about a Cascade model and whether installation could be guaranteed for March 9; Bob (sales manager) replied offering deluxe installation guaranteeing March 9 for an extra $250; Ana accepted; Bob confirmed. Issue: Was a contract formed between Ana and Basin? Key professor feedback / lessons: (1) Good to start with the governing source of law — but actually STATE THE RULE, and because this was a hybrid goods/services contract, apply the predominant factor test. (2) Frame why you’re analyzing offer — to form a contract you need offer, acceptance, AND consideration. (3) There were THREE potential offers; discuss each separately and decide which one was the valid offer that could be accepted. (4) Ads are generally invitations to deal, not offers — analyze the elements; here ‘purchase any of our in-stock models’ left subject matter and quantity unclear, so the ad was NOT a valid offer. (5) Ana’s email lacked a present intent to be bound (‘I’m interested in a Cascade model…,’ and conditioned on the date), so it was not an offer. (6) Bob’s email WAS the valid offer — read together with the ad and Ana’s inquiry it had definite terms (parties, price from the ad, subject matter/quantity from Ana) and was communicated to an identified offeree. (7) Points were lost for giving no rules and no full analysis of acceptance and consideration. Takeaway: separate and analyze each potential offer, always state the rule before applying it, run the predominant factor test on hybrid contracts, and complete the full offer → acceptance → consideration analysis.'},
      {t:'concept', n:'📖 Understanding Contracts Ch. 2 (Consideration) — Module 6 covers §§2.01–2.03 (enforceability, formal alternatives, bargained-for exchange) and §§2.05–2.08 (adequacy, pre-existing duty, past consideration/moral obligation, guaranty).'},
      {t:'rule', n:'§2.01 Enforceability: a contract is a legally enforceable promise, but not all promises are enforceable. The main test is the CONSIDERATION doctrine — a promise supported by consideration is presumptively (prima facie) enforceable; absent consideration or a substitute, the promise is not enforceable (Restatement §17).'},
      {t:'rule', n:'§2.02 Formal alternatives to consideration: formalities serve four functions (Lon Fuller) — CAUTIONARY (slow the parties down to reflect), EVIDENTIARY (prove a real promise was made), CHANNELING (signal a legally binding promise), and CLARIFICATION (a writing reduces ambiguity).'},
      {t:'concept', n:'§2.02[B] The SEAL (wax impressed with a stamp — later just the word \'seal,\' \'L.S.,\' or even a dash, as in Appeal of Hacker) historically made a promise enforceable via the writ of covenant, WITHOUT consideration. It has largely fallen into disuse: UCC §2-203 abolishes its effect for sales of goods, and most states have eliminated or limited it (a few keep a longer limitations period or a rebuttable presumption of consideration).'},
      {t:'concept', n:'§2.02[C] The Uniform Written Obligations Act makes a signed written promise enforceable if it contains an express statement that the signer intends to be legally bound — adopted in only two states and surviving (narrowly) only in Pennsylvania.'},
      {t:'rule', n:'§2.03 Consideration = a BARGAINED-FOR EXCHANGE (Restatement §71): each party gives the other what it seeks as a quid pro quo — \'I\'ll give you what you want if you give me what I want.\' Think of consideration as \'the promisor\'s price\' for her promise.'},
      {t:'concept', n:'§2.03[B] An older test asks whether the promisee suffered a DETRIMENT or the promisor gained a BENEFIT. Hamer v. Sidway: a nephew\'s forbearance from drinking, smoking, and gambling — giving up a LEGAL RIGHT — was a sufficient legal detriment, so the uncle\'s promise to pay $5,000 was enforceable. The Restatement disclaims benefit/detriment language; the key is that the benefit or detriment must be BARGAINED FOR.'},
      {t:'exam', n:'Exam trap (Prendergast v. Snoeberger): a detriment the promisee happened to suffer, or a benefit the promisor happened to gain, is NOT consideration unless it was bargained for — sought by the promisor in exchange for the promise. A promise made AFTER a completed gift is not part of an exchange. (Also: do not find consideration in the promisor\'s own duty to perform — that\'s backwards.)'},
      {t:'rule', n:'§2.03[C] An exchange of unperformed (executory) PROMISES is consideration: when one promise is exchanged for another, both are supported by consideration so long as actual performance of each would be consideration. Barb\'s promise to pay $18,000 is consideration for Sam\'s promise to sell his car, even before either performs.'},
      {t:'rule', n:'§2.03[D]–[E] Consideration can also be a PERFORMANCE (reward and \'prove me wrong\' offers — a unilateral contract where the requested act is both the acceptance and the consideration) or FORBEARANCE (giving up a legal right at the promisor\'s request — Hamer v. Sidway). For forbearance, what the promisor SOUGHT controls: if she bargained for a promise to forbear, actual forbearance without a promise is not consideration.'},
      {t:'rule', n:'§2.05[A] ADEQUACY: courts do NOT inquire into the adequacy (relative value) of consideration — \'a mere peppercorn\' suffices if the parties really bargained for it (the peppercorn theory). As long as there is a real exchange, parties may trade for whatever they want, regardless of economic value (a core part of freedom of contract). Batsakis v. Demotsis — a $2,000 promise for ~$25 of wartime drachmae was enforced.'},
      {t:'concept', n:'§2.05[B] BUT a gross disparity can show there was no real bargain — i.e., SHAM / nominal consideration. Schnell v. Nell: exchanging $200 for 1¢ was not a real exchange (sums of fixed value), so the 1¢ was merely nominal and the promise unenforceable. Contrast Batsakis (a genuine, if risky, loan).'},
      {t:'rule', n:'§2.05[C] Settlement of disputed claims: forbearance from suing on a DISPUTED claim is consideration for a settlement — even if the claim later proves invalid — as long as it was asserted in GOOD FAITH (Restatement §74; Fiege v. Boehm — dropping a paternity claim, later disproven by blood tests, was consideration because asserted in good faith). This balances the no-adequacy-inquiry rule against discouraging extortion.'},
      {t:'concept', n:'§2.05[D] A RECITAL that consideration was given (\'for value received\') does NOT make a gift promise enforceable if there was no real exchange (\'the parties may shout consideration to the housetops...\'). EXCEPTIONS where a recital can suffice: option contracts (Restatement §87) and guaranty contracts (Restatement §88) — though most courts still require the recited consideration to have actually been paid.'},
      {t:'rule', n:'§2.05[E] An ILLUSORY promise — one whose performance is entirely optional (\'I\'ll buy it if I want to\') — is NOT consideration, so the contract fails for lack of MUTUALITY of obligation (\'both must be bound, or neither\'). Modern law has nearly eliminated this branch by finding meaningful limits in most agreements.'},
      {t:'case', n:'Wood v. Lucy, Lady Duff-Gordon (Cardozo, 1917): an exclusive-dealing agreement to market Lucy\'s fashion endorsements was saved by an IMPLIED promise that Wood would use \'reasonable efforts,\' which supplied the consideration for her promise of exclusivity. (UCC §2-306(2) now imposes a \'best efforts\' duty in exclusive-dealing goods contracts.)'},
      {t:'concept', n:'Other limits that keep a promise from being illusory: a CONDITIONAL promise is real if the condition is genuinely uncertain (insurance) or the promisor must use good-faith/reasonable efforts toward it; a SATISFACTION clause is real because satisfaction must be genuine/good faith (Mattei v. Hopper); a UNILATERAL right to TERMINATE is fine if limited by a notice requirement or good faith (Laclede Gas v. Amoco); and OUTPUT/REQUIREMENTS contracts are enforceable because quantity is bound by GOOD FAITH (UCC §2-306).'},
      {t:'rule', n:'§2.06 PRE-EXISTING DUTY RULE: a promise to do (or the doing of) what one is ALREADY legally bound to do is not consideration — so a ONE-SIDED modification of an existing contract lacks consideration (\'past consideration is no consideration\'). Lingenfelder v. Wainwright Brewery.'},
      {t:'case', n:'Alaska Packers\' Ass\'n v. Domenico: fishermen who, mid-voyage, demanded double pay to do their EXISTING job gave no consideration for the owner\'s promise — showing how the rule blocks COERCED modifications. (Critique: the rule is over-broad — it also blocks good-faith modifications, while trivial \'sham\' consideration can satisfy it even where coercion exists.)'},
      {t:'rule', n:'Exceptions enforcing a one-sided modification WITHOUT new consideration: (1) a modification \'fair and equitable in view of circumstances not anticipated\' (Restatement §89; Angel v. Murray); (2) foreseeable RELIANCE on the modification (promissory estoppel); (3) UCC §2-209 — a GOOD-FAITH modification of a goods contract needs NO new consideration; (4) the three-step rescind-and-re-contract device; and (5) international rules (CISG Art. 29) require no consideration at all.'},
      {t:'rule', n:'§2.06[B] ACCORD AND SATISFACTION: an agreement to settle a debt (the \'accord\') plus its performance (the \'satisfaction\') discharges the original debt. Paying a LESSER sum already due is not consideration for releasing the balance UNLESS the debt is disputed/unliquidated or the debtor changes performance (pays early, adds something). UCC §3-311 governs \'payment in full\' checks (claim disputed/unliquidated + conspicuous full-satisfaction notation + good faith).'},
      {t:'concept', n:'§2.06[C] Pre-existing duty to a THIRD party: McDevitt v. Stokes held a jockey\'s bonus promise unenforceable because he already owed a duty to ride the horse to win. The Restatement (Second) disagrees and would enforce it, since the coercion concern behind the rule is absent.'},
      {t:'rule', n:'§2.07[A]–[B] PAST CONSIDERATION is no consideration: a promise made in recognition of a benefit ALREADY received is not part of an exchange. Mills v. Wyman — a father\'s promise to pay for his adult son\'s past care was unenforceable; a mere MORAL obligation (\'the tribunal of conscience\') does not make a promise binding.'},
      {t:'case', n:'§2.07[C] MATERIAL BENEFIT RULE (minority / Restatement §86): a promise made in recognition of a material benefit previously received may be enforced \'to the extent necessary to prevent injustice.\' Webb v. McGowin — an employer\'s promise to pay the worker who was gravely injured saving his life was enforced (contrast Mills v. Wyman). Not enforced where the benefit was a gift or the promise is disproportionate to the benefit.'},
      {t:'rule', n:'§2.07[D] Promises to pay obligations DISCHARGED BY OPERATION OF LAW are enforceable WITHOUT new consideration: a new promise to pay (1) a debt discharged in BANKRUPTCY (\'reaffirmation\'), (2) a debt barred by the STATUTE OF LIMITATIONS, (3) an obligation incurred while a MINOR or incompetent (ratification on regaining capacity), or (4) a duty discharged by the failure of a non-material condition (waiver).'},
      {t:'rule', n:'§2.08 GUARANTY (suretyship) contracts have three parties: the principal debtor (obligor), the creditor (obligee), and the guarantor/surety. The surety\'s promise needs consideration: if made AT THE TIME of the loan, the loan itself is the consideration (\'lend money to Junior and I\'ll pay if he defaults\'); if made AFTER the loan, the past loan is \'past consideration,\' so new consideration (e.g., the creditor\'s forbearance or an extended due date) is required. Surety promises must be in writing under the Statute of Frauds.'},
      {t:'rule', n:'Common-law UNILATERAL acceptance — complete performance required (Mod 6 video): Under the common law, the FIRST question in acceptance is whether the offer is unilateral or bilateral (unlike the UCC, it matters HOW the offeror phrased the offer). A unilateral offer demands a performance as the acceptance ("I\'ll pay $5,000 if you paint my house — and the only way to accept is to paint it"). To accept, the offeree must COMPLETE the requested act — partial, or even nearly-complete, performance does NOT form the contract. The contract forms at the instant performance is finished, and acceptance and consideration are linked at that moment.'},
      {t:'rule', n:'Unilateral acceptance — notice of completion (Mod 6 video): Because a unilateral contract forms only when performance is complete, the offeror may not know acceptance occurred. Rules: (1) If the offer EXPRESSLY requires notice of completion, that notice is PART OF the performance — the offeree must give it to be entitled to payment. (2) If the offer is silent, the offeree need NOT give notice, but giving it has the same effect (it ensures the offeror learns a contract was formed). (3) The offeree MUST give notice even when the offer is silent if the offeror will NOT discover completion in the normal course of events (e.g., offeror is out of state and never saw performance begin). Carlill v. Carbolic Smoke Ball: Mrs. Carlill did not have to give notice — the company would learn of her performance when she applied for the reward.'},
      {t:'rule', n:'Bilateral acceptance — three characteristics of an effective acceptance (Mod 6 video, common law): (1) COMMITMENT / INTENT — the same objective test used for an offer (Lucy v. Zehmer): would a reasonable person, similarly situated, believe the offeree intended to form a contract? (2) COMMUNICATION — the acceptance must reach the offeror, and by the right MEANS. (3) TIMING — effective upon DISPATCH (mailbox rule). The acceptance must also be a MIRROR IMAGE of the offer; adding ANY additional or different term, however trivial ("...with closing on Monday"), makes it a counteroffer, not an acceptance.'},
      {t:'rule', n:'Means of communicating acceptance — offeror is master of the offer (Mod 6 video): If the offer EXPRESSLY specifies a means of acceptance (e.g., "accept by return mail," "only in person," or even "only while wearing a yellow shirt"), that is the ONLY valid way to accept — any other method fails no matter how sincere. If the offer is SILENT on means, the offeree may accept either (a) the same way the offer came, OR (b) any other method that is as FAST and as legally DEPENDABLE as the way the offer was communicated (so a mailed offer may be accepted by email or phone).'},
      {t:'rule', n:'FOUR exceptions to the mailbox rule (acceptance NOT effective on dispatch) — Mod 6 video: (1) The offer EXPRESSLY says the mailbox rule does not apply → acceptance effective on RECEIPT, like any other business communication. (2) OPTION contracts — the mailbox rule cannot extend the option; the acceptance must be RECEIVED before the option period ends (an acceptance dispatched day 29 but received day 32 of a 30-day option is too late). (3) MERCHANT FIRM OFFERS (UCC §2-205) — like options, the acceptance must be RECEIVED within the firm-offer period; dispatching within it is not enough. (4) The VACILLATING OFFEREE (see separate note).'},
      {t:'exam', n:'Vacillating offeree — two scenarios, map the timeline! (Mod 6 video): SCENARIO A (acceptance first, then rejection): offeree properly dispatches an ACCEPTANCE (effective on dispatch), then changes mind and dispatches a REJECTION. There is NO contract ONLY IF the rejection ARRIVES FIRST *and* the offeror RELIES on it to their detriment (e.g., sells to someone else for less). Earlier arrival alone is not enough — without detrimental reliance the mailbox rule still forms the contract at dispatch of the acceptance. SCENARIO B (rejection first, then acceptance): offeree dispatches a REJECTION, then before it is received changes mind and dispatches an ACCEPTANCE. The mailbox rule does NOT apply — it becomes a RACE: whichever is RECEIVED first controls (rejection received first = no contract; acceptance received first = contract).'},
      {t:'rule', n:'What the mailbox rule applies to (Mod 6 video): It applies to any NON-INSTANTANEOUS method of dispatching a bilateral acceptance (a promise) — mail, fax, telegram, private courier. For EMAIL and VOICE MESSAGES, jurisdictions SPLIT — some apply the mailbox rule, some do not. Remember it is ONLY for ACCEPTANCES; offers, revocations, rejections, and counteroffers are all effective on RECEIPT. Key to every mailbox-rule problem: be precise on the TIMELINE of when each communication was dispatched and received.'},
      {t:'rule', n:'Acceptance by SILENCE or conduct (Mod 6 video): Silence generally is NOT acceptance and cannot be UNILATERALLY imposed on an offeree, no matter what the offer says. Silence operates as acceptance only when: (1) the offeree AGREED IN ADVANCE that silence would count ("if you don\'t hear from me by Friday, send the next shipment"); (2) the nature of the transaction is such that the offeree would be EXPECTED TO SPEAK — Day v. Caton (Module 4) (courts apply this reluctantly outside commercial settings); or (3) the parties have an established PATTERN OF CONDUCT — Hobbs v. Massasoit Whip Co. (the eelskins case), where prior dealings made receiving and keeping the goods an acceptance. Absent one of these, no one can be forced to pay for unsolicited merchandise. Conduct by performing the act you would have promised to do is itself a promise (acceptance by performance of a bilateral offer).'},
      {t:'concept', n:'Consideration — three requirements framing (Mod 6 video): For EACH promise, consideration requires (1) BARGAINED-FOR EXCHANGE — one party\'s promise induced the other to make a specific promise in return (quid pro quo; no back-and-forth negotiation needed — a flat "yes" still counts, and each party must get the very thing that induced it, so the offeree cannot be forced to accept a substitute — the "penny farthing" example, which is also the logic behind the pre-existing duty rule and why past acts are not present consideration); (2) LEGAL SUFFICIENCY — a detriment to the party providing it OR a benefit to the party receiving it (the degree/amount is irrelevant, and courts do not weigh fair value — the "peppercorn"); and (3) DETERMINABLE — the thing promised and its quantity must be capable of objective determination. Each promise is analyzed SEPARATELY; one promise meeting the test says nothing about whether the other does.'},
      {t:'case', n:'Gottlieb v. Tropicana Hotel & Casino (N.D. Ill. 2000, 109 F.Supp.2d 1010) — UNILATERAL contract and consideration. The casino ran a "Millionaire Wheel" promotion: swipe your player card and spin. Gottlieb swiped, spun, landed on $1M — and the casino refused. HELD: a valid unilateral contract formed (offer accepted by performance), and there WAS consideration even though she paid nothing to spin: she gave the bargained-for benefit (presence, swiping her card so the casino could capture her data) and the detriment of coming and standing in line.'},
      {t:'case', n:'Fiege v. Boehm (Md. 1956, 210 Md. 352) — FORBEARANCE to sue as consideration. A woman forbore a bastardy action in exchange for a man\'s promise to pay pregnancy/support expenses; blood tests later showed he was not the father. HELD: forbearance to assert a legal claim is valid consideration even if the claim would have failed, so long as it was asserted in GOOD FAITH with a reasonable belief in its validity.'},
      {t:'case', n:'Schwartzreich v. Bauman-Basch, Inc. (N.Y. 1921, 231 N.Y. 196) — PRE-EXISTING DUTY rule and rescission. An employee under a one-year contract got a better outside offer; to keep him the employer agreed to a higher salary, and the old contract was torn up at the moment the new one was signed. HELD: the pre-existing duty rule did NOT bar the raise, because the parties MUTUALLY RESCINDED the old contract and simultaneously formed a NEW one — each gave up rights, supplying consideration.'}
    ]},
    { w:7, topic:'Consideration — UCC contract modification & illusory promises & Warranties (Sec.5.09)', tags:['consideration','UCC modification','good faith','illusory promises','output contracts','requirements contracts','satisfaction clause','Roth Steel','Mezzanotte v. Freeland','warranties','express warranty','implied warranty','merchantability','fitness'], notes:[
      {t:'concept', n:'📖 Reading — Ferriell §§2.04–2.05, §2.06[A], §2.07; §5.09; §10.06. Required cases: Roth Steel Products v. Sharon Steel; Wood v. Lucy, Lady Duff-Gordon; Mezzanotte v. Freeland. (Optional: Ridge Runner Forestry v. Veneman; Miami Coca-Cola v. Orange Crush; Texas Gas Utilities v. Barrett; Summits 7 v. Kelly.)'},
      {t:'exam', n:'📋 Module 7 (Modification & Mutuality of Obligation): Graded — Resource Quiz (10 pts); Module Quiz (20 pts); Seminar (2 pts).'},
      {t:'concept', n:'Module 7 agenda (CL610 Contracts — Consideration continued): (1) UCC contract modification; (2) Illusory promises.'},
      {t:'rule', n:'UCC contract modification: Unlike common law, the UCC does NOT require new consideration to modify a contract for the sale of goods. Under UCC § 2-209, a modification needs only good faith — no additional consideration is necessary.'},
      {t:'case', n:'Roth Steel Products v. Sharon Steel Corp., 705 F.2d 134 (6th Cir. 1983): Sharon agreed to sell steel to Roth at discounted prices, then tried to withdraw its price concessions. Unable to find cheaper steel, Roth agreed to a compromise price higher than the original. Held: Under the UCC, contract modification does not require new consideration — modification only requires good faith.'},
      {t:'rule', n:'Illusory promises: A promise that does not actually bind the promisor to any legal detriment is illusory (e.g., "I will buy as many as I want"). An illusory promise CANNOT serve as consideration because the promisor has not truly committed to anything.'},
      {t:'rule', n:'Output & requirements contracts are exceptions — NOT illusory. Although quantity seems open-ended, the UCC implies a good-faith obligation (output = all the seller produces; requirements = all the buyer needs), which supplies a real legal detriment and valid consideration.'},
      {t:'rule', n:'Satisfaction / conditional promises: A promise conditioned on an event within the promisor\'s control is not illusory if the promisor impliedly promises to make reasonable effort to bring the event about, or to use good faith and honest judgment in determining whether it occurred.'},
      {t:'case', n:'Mezzanotte v. Freeland, 20 N.C. App. 11, 200 S.E.2d 410 (N.C. Ct. App. 1973): The Mezzanottes agreed to buy real estate from the Freelands, contingent on securing a mortgage with terms "to their satisfaction." They obtained a mortgage from a different bank, but the Freelands refused to convey. Held: A promise conditioned on an event within the promisor\'s control is not illusory where the promisor impliedly promises reasonable effort, good faith, and honest judgment — so the agreement was supported by consideration and enforceable.'},
      {t:'exam', n:'Hypo (widget modification): Buyer contracts for 1,000 widgets at $100,000 ($100/each). After manufacture, the CEO demands an extra $1/widget; Buyer reluctantly agrees, then refuses to pay the extra $1,000. Because goods are involved, the UCC governs: modification requires no new consideration, only good faith. The key issue is whether the CEO\'s mid-performance demand was made in good faith — if not (coercion / no legitimate commercial reason), the modification is unenforceable.'},
      {t:'exam', n:'Seminar 7 conclusion: (1) Under the UCC, no new consideration is needed to modify a contract — only good faith. (2) Illusory promises do not bind the promisor to a legal detriment and cannot be consideration. (3) Output and requirements contracts are exceptions and are NOT illusory. (4) Promises implying reasonable effort, good faith, and honest judgment to bring about a condition are also not illusory.'},
      {t:'rule', n:'📖 §2.04 Promises to make a GIFT (gratuitous promises) are generally UNENFORCEABLE — they are not part of an exchange (Dougherty v. Salt — a note \'for value received\' that was really a gift; Kirksey v. Kirksey).'},
      {t:'concept', n:'§2.04[B] Conditional gift vs. bargain: when a gift promise has \'strings,\' ask whether the condition was bargained for (a request for consideration) or merely a limit on the donor\'s generosity / a step needed to receive the gift. Guidepost: does the promisor gain an advantage from the condition? (\'Come to my office to get $6 for lunch\' = conditional gift; a prize offered to induce auction attendance = bargained-for, Maughs v. Porter.)'},
      {t:'concept', n:'§2.04[C] Charitable pledges: courts strain to enforce them — finding consideration in other subscribers\' promises (\'I\'ll pledge if you will,\' Congregation B\'nai Sholom v. Martin), in naming rights, in an implied promise to use the funds as directed, or via promissory estoppel / foreseeable reliance. Restatement §90(2) would enforce a charitable pledge without proof of actual reliance, but few courts follow it (Allegheny College v. Nat\'l Chautauqua).'},
      {t:'concept', n:'Module 7 (Modification & Mutuality) also assigns §2.05 (adequacy of consideration, incl. illusory promises & Wood v. Lucy), §2.06[A] (one-sided modification & the pre-existing duty rule — Roth Steel; Angel v. Murray; UCC §2-209), and §2.07 (past consideration) — the full notes for those sections are in Week 6 (Module 6).'},
      {t:'rule', n:'§10.06 DUTY OF GOOD FAITH & FAIR DEALING — implied in EVERY contract (Rest. §205; UCC §1-304: \'every contract or duty imposes an obligation of good faith in its performance and enforcement\'). Origin: a duty not to interfere with the other party\'s performance (Patterson v. Meyerhofer — buyer bid against the seller at the foreclosure sale he needed to win to convey the land). Affirmative form: Kirke La Shelle v. Paul Armstrong — \'neither party shall do anything to destroy or injure the right of the other to receive the fruits of the contract.\''},
      {t:'rule', n:'§10.06[A] MEANING of good faith. UCC §1-201(b)(20) now defines it for everyone as \'HONESTY IN FACT and the observance of reasonable commercial standards of FAIR DEALING\' (the old merchant standard, extended to all). It is usually defined by the conduct it PREVENTS (Summers/Rest. §205 cmt.): evasion of the spirit of the deal, lack of diligence, abuse of a power to specify terms or determine compliance, \'weaseling\' interpretations, interfering with the other\'s performance, and abusing a termination right. Market Street Associates v. Frey (Posner): parties need not act altruistically or as fiduciaries — they just may not take OPPORTUNISTIC advantage of gaps/circumstances not contemplated when the contract was made.'},
      {t:'case', n:'Wood v. Lucy, Lady Duff-Gordon (N.Y. 1917, Cardozo) — §10.06[B] BEST/REASONABLE EFFORTS. A fashion designer gave Wood the exclusive right to market her endorsements; she paid nothing herself and sued him for using her name without her consent. The promise seemed ILLUSORY (Wood promised nothing express), but Cardozo implied a duty to use REASONABLE EFFORTS — his exclusive right + her pay being a % of his sales made the whole deal pointless otherwise. UCC §2-306(2) codifies a \'best efforts\' duty in exclusive-dealing contracts. Bloor v. Falstaff (express \'best efforts\' to promote Ballantine beer — can\'t let the acquired brand languish to favor its own).'},
      {t:'rule', n:'§10.06[C] Good faith cabins DISCRETION. Where a party holds discretion, it must be exercised in good faith: (1) REQUIREMENTS/OUTPUT contracts — quantity = actual good-faith requirements/output (UCC §2-306(1); Feld v. Levy — can\'t shut down output just to escape a bad price); (2) PRICE set by one party — \'a price to be fixed... means a price to fix in GOOD FAITH\' (§2-305(2); Best v. US National Bank — NSF fees must track the customer\'s reasonable expectations); (3) UNILATERAL TERMINATION — §2-309 requires reasonable NOTICE; loan-acceleration \'deems itself insecure\' clauses limited by §1-309 good faith; (4) MODIFICATIONS — enforceable without consideration if not procured by duress/bad faith (§2-209; Rest. §89).'},
      {t:'rule', n:'§10.06[C][5]-[8] Good faith in special settings: (5) EMPLOYMENT AT WILL — good faith plays a LIMITED role; an at-will employee can be fired for any/no reason, with narrow exceptions for discharge violating public policy (discrimination, whistleblowing); (6) LENDER LIABILITY — K.M.C. v. Irving Trust (bank\'s good-faith duty barred it from cutting off a credit line and demanding payment without giving the borrower a chance to refinance) — but Kham & Nate\'s Shoes (Easterbrook) reads the duty narrowly (no opportunistic exploitation, not altruism); (7) PERCENTAGE LEASES — a tenant may not divert business off the premises solely to cut percentage rent (Goldberg v. Levy); (8) INSURANCE — a bad-faith refusal to settle/pay a valid claim sounds in TORT.'},
      {t:'rule', n:'Module 7 videos — CONSIDERATION has THREE requirements, and a problem with ANY one defeats it: (1) BARGAINED-FOR EXCHANGE — each party\'s promise INDUCES/motivates the other\'s (a true quid pro quo); (2) LEGAL SUFFICIENCY — the consideration is a BENEFIT to the recipient OR a DETRIMENT to the provider (EITHER one suffices); (3) DETERMINABILITY (mutuality) — each party is actually OBLIGATED and the obligation is objectively determinable (no illusory promises). Analyze EACH party\'s proposed consideration through all three. If consideration fails, look next for a consideration SUBSTITUTE (Module 8).'},
      {t:'rule', n:'Module 7 videos — PROBLEMS with BARGAINED-FOR EXCHANGE (three): (a) PAST EVENTS — past consideration is no consideration (a promise must induce a CURRENT exchange; the neighbor already shoveled the drive before the $500 promise → not enforceable). (b) GIFTS — a gift promise is a one-way flow, unenforceable, UNLESS a bargain is hidden in it (a conditional "gift" where the condition is really what the promisor SOUGHT — the bicycle offered to induce lunch at the Brussels-Sprout restaurant = an exchange, enforceable; a condition that\'s merely a step to receive the gift is not). (c) MORAL OBLIGATION / "shoulds & oughts" — a promise made because one feels one OUGHT to is not consideration (grandma\'s $5,000/month "because she\'s proud" = gift; but "$5,000/month AS LONG AS you stay in law school" = bargain). Car-accident: "I\'ll pay $25k because I feel bad" = unenforceable; "I\'ll pay $25k IF you release your claims" = bargained-for, enforceable. (Kirksey — moving in reliance on a gift promise was a condition, not consideration.)'},
      {t:'exam', n:'Module 7 videos — TWO EXCEPTIONS that revive PAST consideration (public policy): (1) TIME-BARRED DEBT — a debtor\'s new promise, IN A SIGNED WRITING, to pay a debt already barred by the statute of limitations is ENFORCEABLE without new consideration (revival of the debt). (2) REQUESTED PERFORMANCE + EXPECTATION OF PAYMENT — if the promisor REQUESTED the performance AND the promisee performed EXPECTING to be paid, a LATER promise to pay is enforceable even though it induced no current exchange ("hey, could you shovel mine too?" → the neighbor expected pay → a later promise to pay is enforceable). (These are the promissory-restitution / material-benefit precursors covered fully in Module 8.)'},
      {t:'rule', n:'Module 7 videos — LEGAL SUFFICIENCY in depth. Consideration is legally sufficient if it is a BENEFIT to the recipient OR a DETRIMENT to the provider (either alone works). DETRIMENT means the promisor does something she is NOT REQUIRED to do, OR REFRAINS from something she has a RIGHT (or a good-faith, reasonable BELIEF of a right) to do — courts do NOT weigh economic value. Gottlieb v. Tropicana — a casino Diamond-Club member who gave up her personal data (and her time waiting in line) for a chance to spin the million-dollar wheel provided BOTH a detriment to her and a benefit to the casino → sufficient consideration. Fiege v. Boehm — a woman\'s forbearance from suing to establish paternity (in exchange for support payments) was sufficient consideration EVEN THOUGH blood tests later showed the man was not the father: the test is whether she had a GOOD-FAITH, reasonable belief she could bring the claim AT THE TIME (not whether she would win). NOTE: consideration may be provided by a THIRD PARTY — it doesn\'t matter who provides it, so long as it\'s bargained for.'},
      {t:'rule', n:'Module 7 videos — PRE-EXISTING DUTY + DETERMINABILITY. PRE-EXISTING DUTY RULE: performing (or promising to perform) a duty you ALREADY owe (by contract or by law) is NOT new consideration for an added promise. One consideration CAN support multiple promises made together (one price to re-roof + tuckpoint + paint + new windows is fine), but you cannot later reuse that SAME consideration to buy an ADD-ON (a new porch floor) — the add-on needs its OWN consideration (Schwartzreich v. Bauman-Basch). EXCEPTION (Angel v. Murray): if UNANTICIPATED circumstances, through no fault of the performing party, make performance SUBSTANTIALLY more burdensome, additional consideration is allowed (unless that party assumed the risk) — e.g., a storm knocks the top off the chimney so tuckpointing now requires rebuilding it. DETERMINABILITY — an ILLUSORY promise (performance left to the promisor\'s unfettered discretion, "if I feel like it") is not consideration (no mutuality). THREE promises that LOOK illusory but ARE enforced: (1) NO DEFINITE UNDERTAKING → courts imply a duty of reasonable/good-faith efforts (Wood v. Lucy); (2) OUTPUT/REQUIREMENTS contracts → bound by GOOD FAITH and no quantity "unreasonably disproportionate" to estimates/past dealings (UCC §2-306); (3) CONDITIONS OF SATISFACTION → professional satisfaction is judged by an objective/good-faith professional standard, personal satisfaction by good faith.'},
      {t:'concept', n:'📖 WARRANTIES — Ferriell Chapter 7 (§§7.01–7.09). A reference module on UCC Article 2 warranties (Ch. 7 sits between Parol Evidence (Ch. 6) and Conditions (Ch. 8)). §7.01 INTRO: the old rule was CAVEAT EMPTOR, now nearly abandoned. A WARRANTY is essentially a PROMISE about the accuracy of facts and the continued quality/performance of goods (or land/services), often into the FUTURE (e.g., \'3 years or 30,000 miles\'), commonly paired with a LIMITED REMEDY (repair/replace) and a disclaimer of other damages.'},
      {t:'rule', n:'§7.01[B] SOURCES OF WARRANTY LAW. UCC Article 2 provides four: (1) EXPRESS warranties (§2-313); (2) implied warranty of MERCHANTABILITY (§2-314); (3) implied warranty of FITNESS FOR A PARTICULAR PURPOSE (§2-315); (4) implied warranty of GOOD TITLE (§2-312). Written warranties on CONSUMER products are also regulated by the federal MAGNUSON-MOSS Act. International sales → the CISG (Art. 35). The COMMON LAW supplies the implied warranty of HABITABILITY (new homes; residential leases).'},
      {t:'rule', n:'§7.02 EXPRESS WARRANTIES (§2-313). Arises from any of these that is \'part of the BASIS OF THE BARGAIN\': (a) the seller\'s AFFIRMATION OF FACT or PROMISE about the goods; (b) a DESCRIPTION; (c) a SAMPLE or MODEL. The seller need NOT use \'warranty\'/\'guarantee\' or even intend to warrant, and it need not be in writing. A SAMPLE is drawn from the actual goods (more definitive); a MODEL is a mere exemplar. Samples/models given AFTER the buyer commits are less likely to be \'basis of the bargain.\''},
      {t:'rule', n:'§7.02[A] AFFIRMATION OF FACT vs. OPINION/PUFFERY. Affirmations of fact and promises create warranties; OPINIONS and \'sales talk\' (puffing) do NOT. \'Great car, runs like a dream\' = puffery; \'1980 model,\' \'35 mpg\' = warranties. Fact vs. opinion turns on SPECIFICITY and relative EXPERTISE (Royal Business Machines \'decisive test\': did the seller assert a fact of which the buyer was ignorant, or merely opine?). The statement must \'RELATE TO THE GOODS.\''},
      {t:'case', n:'Royal Business Machines, Inc. v. Lorraine Corp. (7th Cir. 1980, 633 F.2d 34) — fact vs. opinion + \'relate to the goods.\' The \'decisive test\' for a warranty vs. an opinion is \'whether the seller asserts a fact of which the buyer is ignorant or merely states an opinion... on which the buyer may be expected also to have an opinion.\' Statements about \'replacement parts\' availability and low \'cost of supplies\' were held not to relate to the copier itself. Also: a buyer who gains expertise through repeat dealings may not reasonably rely.'},
      {t:'case', n:'Daughtrey v. Ashe (Va. 1992, 413 S.E.2d 336) — description as an EXPRESS WARRANTY. A jeweler\'s written notation that diamonds were of \'v.v.s quality\' was a factual affirmation/description, NOT a mere opinion, and created an express warranty that the diamonds met that grade. Specific, verifiable quality grades are facts, not puffery.'},
      {t:'case', n:'Guiggey v. Bombardier (Me. 1992, 615 A.2d 1169) — PUFFERY. A used-snowmobile seller\'s statements that it \'runs nice,\' that the prior owner \'took real good care of it,\' and that it \'will go good\' were too vague to be affirmations of fact — mere puffing creating no express warranty.'},
      {t:'case', n:'CBS, Inc. v. Ziff-Davis Publishing Co. (N.Y. 1990, 553 N.E.2d 997) — \'BASIS OF THE BARGAIN\' without belief. Ziff-Davis warranted the accuracy of financial data about magazines it sold to CBS; CBS\'s own investigation led it to DISBELIEVE the figures, yet it closed the deal (reserving its rights). HELD: CBS could still sue — an express warranty is a bargained-for promise about the facts, and CBS \'relied\' by consummating the transaction; the buyer\'s doubt does not defeat the warranty.'},
      {t:'rule', n:'§7.02[E] BASIS OF THE BARGAIN. The Uniform Sales Act required RELIANCE; §2-313 drops that word and asks only whether the affirmation/description/sample was \'part of the basis of the bargain\' — PRESUMED so \'unless good reason is shown to the contrary.\' Courts split: (1) no reliance needed; (2) absence of reliance is a DEFENSE the seller may prove; (3) a minority still require the buyer to prove reliance. Statements made AFTER the deal can still warrant, as modifications.'},
      {t:'rule', n:'§7.03 IMPLIED WARRANTY OF MERCHANTABILITY (§2-314). Arises ONLY IF the seller is a \'MERCHANT WITH RESPECT TO GOODS OF THE KIND\' (also applies to serving food/drink for value). Being a general \'merchant\' (§2-104) is NOT enough — one must have professional status/expertise as to THESE goods. Manufacturers, distributors, retailers who regularly deal almost always qualify; ISOLATED sales of used business EQUIPMENT usually do not, even by an expert user.'},
      {t:'case', n:'Fred J. Moore, Inc. v. Schinmann (Wash. App. 1985, 700 P.2d 754) — \'merchant with respect to goods of the kind.\' A farmer who grew mint for OIL and made a one-time sale of mint ROOTS was a dealer in oil but NOT in roots, so he made NO implied warranty of merchantability on the roots. Expertise in a related product does not make one a merchant of the specific goods sold.'},
      {t:'case', n:'Nutting v. Ford Motor Co. (N.Y. App. Div. 1992, 584 N.Y.S.2d 653) — fleet reseller IS a merchant. The owner of a fleet that REGULARLY sold its whole fleet to a used-car dealer after a year\'s use was a \'merchant with respect to goods of the kind\' and made an implied warranty of merchantability. Regular, systematic reselling confers merchant status.'},
      {t:'rule', n:'§7.03[B] MEANING OF MERCHANTABILITY (§2-314(2)). Goods need not be perfect. To be merchantable they must at least: (a) pass without objection in the TRADE under the contract description; (b) for FUNGIBLE goods, be of fair average quality; (c) be FIT FOR THE ORDINARY PURPOSES (the central test); (d) be of even kind/quality/quantity; (e) be adequately CONTAINED, PACKAGED, and LABELED; and (f) CONFORM to any promises/facts on the label. Note (f) does NOT require the label to be part of the \'basis of the bargain\' — so merchantability can be broader than an express warranty.'},
      {t:'case', n:'Taterka v. Ford Motor Co. (Wis. 1978, 271 N.W.2d 653) — \'fit for the ordinary purpose.\' An improperly installed taillight gasket caused rust that appeared only after 75,000 miles. HELD: the car was NOT unmerchantable — \'where a car can provide safe, reliable transportation it is generally considered merchantable.\' A defect that does not impair fitness for the ORDINARY purpose does not breach the warranty. (Note the overlap of §2-314 with Rest. Torts §402A.)'},
      {t:'rule', n:'§7.04 IMPLIED WARRANTY OF FITNESS FOR A PARTICULAR PURPOSE (§2-315). Three elements: (1) at contracting the seller had REASON TO KNOW the buyer\'s PARTICULAR (non-ordinary) purpose; (2) the buyer actually RELIED on the seller\'s SKILL OR JUDGMENT to select/furnish suitable goods; and (3) the seller had reason to know of that reliance. Unlike merchantability, no merchant status required (but usually the seller is one).'},
      {t:'case', n:'Lewis v. Mobil Oil Corp. (8th Cir. 1971, 438 F.2d 500) — FITNESS for particular purpose. A sawmill operator converting to hydraulic equipment asked the seller to recommend an oil; the seller supplied plain mineral oil (no additives), fine for ordinary use but causing the hydraulic system to break down. HELD: breach of the implied warranty of fitness — the buyer made his need known and relied on the seller\'s judgment, and the goods, though merchantable, were unfit for that particular use.'},
