      {t:'rule', n:'§11.01 UNILATERAL MISTAKE — where only ONE party is mistaken, the contract generally STANDS (the mistaken party is bound). EXCEPTIONS allowing the mistaken party to avoid: (a) the OTHER party KNEW or had reason to know of the mistake (or caused it) — a "palpable" mistake (e.g., an obviously erroneous bid); or (b) enforcement would be UNCONSCIONABLE and the other party has not relied. Otherwise, unilateral mistake is not a defense. (Seminar shorthand: mutual mistake → no contract/voidable; unilateral mistake → contract usually formed.)'},
      {t:'case', n:'§11.03 REFORMATION — Hoffman v. Chapman (Md. 1943), Seminar 11 required case. The Hoffmans agreed to sell (and the Chapmans to buy) a PARTIAL lot with one house, but the DEED was mistakenly drawn to convey the ENTIRE lot (two houses); the Chapmans refused to correct it. Held: the deed could be REFORMED. Where a written document fails to reflect the parties\' actual oral agreement because of a mistake in DRAFTING (a scrivener\'s error), that is treated as a MUTUAL MISTAKE in reducing the agreement to writing, and equity will reform the writing to show the parties\' true intent. Reformation corrects the WRITING; it does not rewrite the parties\' bargain.'},
      {t:'exam', n:'Seminar 11 hypo — MINOR / RATIFICATION: 17-year-old Buyer buys a $10,000 car ($5k down + installments); TWO MONTHS after turning 18 he tries to disaffirm. Result: likely NO — a minor may disaffirm during minority or within a REASONABLE time after reaching majority, but RETAINING and using the car for a reasonable time after turning 18 operates as RATIFICATION (cf. Bobby Floars Toyota — 10 months = ratified). Continued possession/use signals affirmance, so his attempt to disaffirm two months later (while keeping the car) likely fails.'},
      {t:'exam', n:'Seminar 11 hypo — ECONOMIC DURESS: Owner pays Repairer $1,000 to fix vital machinery overnight; Repairer then REFUSES TO RELEASE it unless Owner signs a SECOND contract for unneeded repairs; needing the machine immediately to fill orders, Owner agrees. Result: the second contract is VOIDABLE for economic duress — Repairer made an IMPROPER THREAT (withholding Owner\'s own property / threatening to breach the bailment) that left Owner with NO REASONABLE ALTERNATIVE (she couldn\'t cover in time). This is the Austin Instrument v. Loral pattern; Owner may avoid the second contract.'},
      {t:'exam', n:'Seminar 11 hypo — ILLEGALITY: Tom & Jim contract for fifty 1937 silver dollars for $1,000, but SIX MONTHS BEFORE formation the government made transferring pre-1964 silver coins illegal. Tom pays; Jim refuses to ship; Tom sues. Result: Tom LOSES — the contract was ILLEGAL when formed (its very subject matter was unlawful), so it is VOID and unenforceable; courts leave the parties where they find them. (Note: this is illegality EXISTING at formation, not supervening illegality/impossibility — a void contract, not an excused one. Tom\'s remedy, if any, is restitution of his $1,000, since he is not seriously at fault.)'},
      {t:'exam', n:'Seminar 11 hypo — MINOR & NECESSARIES: 16-year-old Meredith, stranded in a blizzard, takes a motel room from Elroy at $100/night (reasonable value $50); next day she refuses to pay, citing minority. Result: Meredith IS liable — but only in RESTITUTION for the REASONABLE VALUE of a NECESSARY, not the contract price. Emergency shelter for a stranded minor is a necessary of life, so a minor is liable in quasi-contract for its reasonable value; she owes the reasonable $50, NOT Elroy\'s inflated $100 (recovery for necessaries is measured by reasonable value, capping the overcharge).'},
      {t:'rule', n:'Module 11 video — CAPACITY, the mechanics. A contract by someone ADJUDICATED incompetent is VOID; a contract by someone who lacks capacity but has NOT been adjudicated is VOIDABLE — and one-sidedly, only the incapable party may avoid OR enforce it. Voidability lasts only AS LONG AS the incapacity lasts; when it ends, that party may AFFIRM (expressly, or by failing to disaffirm within a reasonable time) and become bound. A MINOR (under 18) can disaffirm at any time while still a minor — even a signed written promise "I won\'t void this" is NO bar — but on turning 18 may affirm. MINOR = a BRIGHT LINE; mental-disability and INTOXICATION incapacity are NOT bright lines (you can be somewhat impaired yet still have capacity — Lucy v. Zehmer rejected the intoxication claim), so both require a FACT-DRIVEN analysis. Intoxication\'s source (alcohol, illegal or prescription drugs, even surgical anesthesia) is irrelevant.'},
      {t:'concept', n:'Module 11 video — NECESSARIES exception (applies to ALL incapacities): a person who lacks capacity is still liable (in restitution) for NECESSARIES — things needed to maintain life AND the party\'s standard of living / "station in life." Beyond the basics (food, clothing, shelter, medical care) it can include, e.g., a chronically ill minor\'s treatment/medication, or a student minor\'s books, supplies, computer, uniforms — so the list is open to judicial, fact-driven interpretation. FRAUD vs. MISREPRESENTATION: contract law treats them as essentially the same. FRAUD IN THE FACTUM/EXECUTION (a LEGAL defense) — the victim didn\'t know she was signing a contract at all (signature obtained by a trick, e.g., a "handwriting sample" that is really a deed) → the contract is VOID (neither party can enforce). FRAUD IN THE INDUCEMENT (an EQUITABLE defense) — the victim knew she was contracting but was deceived about the SUBJECT MATTER (the "mountain view" land that is really a flooded swamp) → the contract is VOIDABLE by the defrauded party (who may instead choose to enforce it).'},
      {t:'rule', n:'Module 11 video — MISTAKE, the framework. Mistake attacks the MEETING OF THE MINDS. Three types, each requiring a MATERIAL term (a mistake about a non-material/minor term supports only money damages or REFORMATION, not avoidance): (1) UNILATERAL — one party mistaken about a material term: NO defense UNLESS the other party KNEW or had REASON TO KNOW of the mistake (then voidable by the mistaken party). (2) MUTUAL — both parties share the SAME false assumption about a material term: VOIDABLE by EITHER party (there was a meeting of the minds, but on a shared error). (3) AMBIGUITY — a material term is capable of more than one meaning: the contract is UNENFORCEABLE (no meeting of the minds) UNLESS both parties intended the SAME meaning (enforced on that meaning), or only ONE party knew of the ambiguity (enforced on the UNAWARE party\'s understanding).'},
      {t:'exam', n:'Module 11 video — UNILATERAL MISTAKE turns entirely on the OTHER party\'s KNOWLEDGE, across contexts: IDENTITY — you (an ordinary "Idris Elba") get a $1M movie-cameo offer clearly meant for the actor: you KNEW/should have known of their mistake → you can\'t enforce it; but "Mary Jones" with no reason to know → she CAN enforce (their problem). COMPUTATIONS — an electrical subcontractor\'s math error yields a $600k bid when the realistic range is $1.1-1.3M: if the general contractor had NO reason to know → enforceable against the sub; but if the other bids were all ~$1.1-1.3M, the GC HAD reason to know → voidable by the mistaken sub. The context (trade norms, the parties\' history, the non-mistaken party\'s sophistication/reliance) decides whether he "had reason to know."'},
      {t:'case', n:'Bal-Mart v. Zinski (baseball-card case; settled, no opinion) — Module 11 video\'s UNILATERAL MISTAKE OF VALUE illustration. A card tagged "1200" (no $ / comma / decimal) was sold by an inexperienced clerk for $12; Bal-Mart claimed it was $1,200 (its true value) and sued to get it back. THREE outcomes by KNOWLEDGE: (1) Bal-Mart priced it $1,200, clerk misread it as $12, and Brian (an EXPERIENCED collector) KNEW it wasn\'t really offered at $12 → NO contract, VOID, Bal-Mart gets the card back. (2) Same, but Brian a NOVICE with no reason to know → ENFORCEABLE (though rescission may be allowed IF the buyer has not RELIED — e.g., not resold to a bona fide purchaser). (3) Bal-Mart didn\'t know what it had and offered a valuable card for $12, and Brian knew its true value → ENFORCEABLE, so long as Brian did not know/should not have known that Bal-Mart was ignorant of what it was selling. Lesson: each party\'s knowledge drives the outcome.'},
      {t:'exam', n:'Module 11 QUIZ REVIEW — MISTAKE (exam-precise definitions): (1) MISTAKE generally — can PREVENT a meeting of the minds, takes three forms (unilateral, mutual, ambiguity), and applies ONLY to MATERIAL terms (all true). (2) UNILATERAL MISTAKE = a mistake by ONLY ONE party to the contract (NOT limited to a single term). (3) MUTUAL MISTAKE = a mistake by BOTH parties about the SAME term. (4) AMBIGUITY = where the MEANING of a term is not clear / is susceptible to multiple meanings (distinguish: NOT where the meaning is clear but the parties merely dispute its application). (5) EFFECT of unilateral mistake — it has NO effect on enforcement UNLESS the NON-mistaken party knew or should have known of the mistake (then the contract is voidable by the mistaken party).'},
      {t:'case', n:'MUTUAL MISTAKE & AMBIGUITY cases (Module 11 video). MUTUAL: Sherwood v. Walker — "Rose 2d of Aberlone," a cow both parties believed BARREN and priced as beef; she was actually pregnant (worth ~10x). Both shared the same false assumption about a material fact (the cow\'s nature) → contract VOIDABLE by either party. (Cf. Wood v. Boynton — a stone both thought a topaz that was really an uncut diamond, used as the topaz/diamond illustration of the mutual-mistake fact pattern.) AMBIGUITY: Raffles v. Wichelhaus — the two ships "PEERLESS" (one sailing from Bombay in October, one in December); the buyer meant the October ship, the seller the December ship. A material term (here, the specific ship) had two meanings with NO shared understanding → no meeting of the minds → UNENFORCEABLE. (If both had meant the December Peerless → enforceable on that meaning; if only one knew of the two ships → enforced on the UNAWARE party\'s understanding.)'},
      {t:'rule', n:'Module 11 video — DURESS vs. UNDUE INFLUENCE, and PHYSICAL DURESS. Both impair a party\'s free will to contract, but DURESS uses COERCION / threats / force and needs NO special relationship, whereas UNDUE INFLUENCE is an abuse of TRUST requiring a fiduciary/confidential relationship. PHYSICAL DURESS = the use of physical force, or a threat of physical force, directed at the party, his family, close business associates, OR his property (\'sign or I\'ll shoot / burn your house down\'), that causes him to act as he otherwise would not → the contract is VOIDABLE by the coerced party. Physical duress is usually obvious in practice.'},
      {t:'exam', n:'Module 11 video — ECONOMIC DURESS: a 4-part CONJUNCTIVE test (ALL four required): (1) BAD FAITH by the other party (at minimum; criminal/tortious conduct also qualifies); (2) NO REASONABLE ALTERNATIVE for the pressured party; (3) CAUSATION — the threat/coercion actually induced the contract; and (4) the OTHER PARTY CAUSED the distress / created the circumstances that forced the deal. THE 4TH ELEMENT IS THE USUAL STICKING POINT. Example: your AC breaks Friday night and a repairer charges an outrageous $1,000/hr weekend rate — that is merely expensive and ENFORCEABLE (elements 1-3 may be met, but the repairer did not create your emergency). It becomes economic DURESS (voidable) ONLY if the repairer deliberately stalled/rebroke appointments to run out the clock until the weekend rate kicked in — i.e., THEY caused the distress. On exams you\'ll often see 1-3 satisfied but 4 missing → no duress.'},
      {t:'rule', n:'Module 11 video — ILLEGALITY (two types). (1) ILLEGAL SUBJECT MATTER — the very thing contracted for is prohibited by law → the contract is VOID, regardless of the gravity (a murder-for-hire contract AND an unlicensed-plumbing contract are BOTH void). (2) ILLEGAL PURPOSE — the subject matter is perfectly legal, but a party\'s REASON for contracting is illegal. KEY KNOWLEDGE/FACILITATION nuance: if the seller merely KNOWS of the buyer\'s illegal purpose but is not part of it, the seller can STILL enforce (the buyer cannot use his own illegal purpose as a defense). BUT if the seller FACILITATES the illegal purpose (repackages, pre-measures, tailors the goods, etc.), it becomes the seller\'s illegal purpose too → the contract is UNENFORCEABLE (the buyer CAN raise illegality). Ex: selling an OTC medicine used to make an illegal drug = still enforceable; but repackaging/pre-measuring it for that use = unenforceable.'},
      {t:'rule', n:'Module 11 video — UNCONSCIONABILITY: a court may void a specific PROVISION or the ENTIRE contract to prevent \'oppression and unfair surprise\' (undefined by UCC/courts). TEST: whether, given the commercial background AND these parties\' needs, the term is so ONE-SIDED as to be unconscionable, judged AT THE TIME of contracting. PROCEDURAL (one-sided process) vs. SUBSTANTIVE (one-sided terms). THREE COMMON FORMS: (1) stealthy/inconspicuous RISK-SHIFTING boilerplate — confession-of-judgment clauses, warranty disclaimers, add-on/cross-collateralization clauses (Williams v. Walker-Thomas) that are inconspicuous or incomprehensible; (2) CONTRACTS OF ADHESION — true \'take it or leave it\' where there is literally NO way to get the goods without agreeing (ProCD v. Zeidenberg — the splash-screen license that wouldn\'t let the buyer proceed without accepting); fact-driven/case-by-case, some courts limit it to necessary goods; (3) PRICE unconscionability — least common (courts are reluctant to police price), usually only in consumer deals where the buyer was unaware of the actual price.'},
      {t:'exam', n:'Module 11 QUIZ REVIEW — DURESS / ILLEGALITY / UNCONSCIONABILITY (exam-precise points): (1) PHYSICAL DURESS = physical force OR the THREAT of physical force (NOT financial harm). (2) ECONOMIC DURESS = accomplished by PRICE GOUGING only WHERE the defendant CREATED the need for his product/service (does NOT require actual financial harm/losses; a mere threat of financial harm isn\'t enough — the defendant must have caused the circumstance). (3) ILLEGAL SUBJECT MATTER is a defense REGARDLESS OF TIMING — whether the subject matter was prohibited before execution, after execution, or while performance is still executory; timing does not matter. (4) ILLEGAL PURPOSE requires that the PURPOSE for entering the contract actually BE prohibited — NOT merely that the legal subject matter COULD be, or was LATER, used illegally. (5) STEALTHY RISK-SHIFTING (all true) — can create an unconscionability defense, shifts risk from the party who normally bears it to the other, and is usually done inconspicuously/unintelligibly. (6) CONTRACTS OF ADHESION — CAN (but do NOT always) create an unconscionability defense; they are NOT always unconscionable. (7) PRICE UNCONSCIONABILITY — usually based on an UNCERTAIN or UNKNOWN price term (not a simple comparison of contract price to fair market value, and not always unconscionable).'},
      {t:'concept', n:'Module 11 FLOWCHART (course roadmap — where Module 11 fits): the whole Contracts course = CONTRACTS → (1) FORMATION → (2) PERFORMANCE → (3) REMEDIES → (4) THIRD-PARTY BENEFICIARIES / ASSIGNMENTS / DELEGATION. FORMATION breaks into: MUTUAL ASSENT (Offer + Acceptance) · CONSIDERATION (Bargained-for Exchange · Promissory Estoppel · Restitution/Quasi-Contract) · and DEFENSES TO FORMATION — which is where Modules 10–11 live (SOF, formation defect, capacity, undue influence, mistake, duress, illegality, unconscionability, misrepresentation/fraud). Module 11 completes the FIRST of the three major areas (Formation); next is Performance & Breach. (Matches the standalone Contracts IRAC Flowchart study aid in OneDrive.)'},
      {t:'exam', n:'Module 11 video — ISSUE-SPOTTING STRATEGY for defenses to enforcement. On an exam, discuss EVERY defense the facts suggest, and as many as they suggest (even if you rule some out). The full menu: Statute of Frauds; no contract (formation defect); Capacity; Undue Influence; Mistake; Duress; Illegality; Unconscionability; Misrepresentation/Fraud. Any ONE of them, if met, blocks enforcement even where mutual assent + consideration exist. STUDY TIP (Prof.): for each defense, identify the CLUE / trigger fact that makes it \'discussable\' (e.g., SOF = one of the MY-LEGS triggers; capacity = a minor/impaired party; duress = a threat; illegality = prohibited subject matter or purpose) and highlight that clue in your notes — it makes issue-spotting far faster.'},
      {t:'case', n:'Austin Instrument, Inc. v. Loral Corp. (N.Y. 1971) — ECONOMIC DURESS (required + quiz-tested). Austin, mid-performance, threatened to STOP delivering precision gear parts Loral needed to build radar sets for the U.S. Navy unless Loral paid more and gave it a second subcontract; Loral agreed, then sued to recover the increase. Held: economic duress — the modification was voidable. KEY EXAM POINT (per the module quiz): a wrongful threat to breach by WITHHOLDING GOODS is NOT, by itself, sufficient to establish economic duress — it amounted to duress here ONLY because Loral also had NO REASONABLE ALTERNATIVE (it could not COVER from another government-approved vendor in time, and would have breached its Navy contract). So the threat alone never suffices; the economic-duress test is CONJUNCTIVE (wrongful threat + no reasonable alternative + causation + the other party caused the distress). (Quiz: the statement that a threat to withhold goods is not sufficient by itself = TRUE.)'},
      {t:'case', n:'Methodist Mission Home of Texas v. N.A.B. (Tex. Civ. App. 1970) — UNDUE INFLUENCE / over-persuasion with NO fiduciary relationship (required + quiz-tested). An unwed mother at a maternity home decided to keep her baby; over a five-day period right after giving birth — while she was weak and vulnerable — counselor Jo Ann Burns ran an "intensive campaign" of one-sided persuasion (reciting only the "cons," calling the parents\' offer of help a sham, stressing that "if plaintiff was any sort of person" she\'d give up the child) until she signed relinquishment papers. Held: undue influence — the instruments were voidable. The over-persuasion factor the court found PRESENT = DISCUSSION AT AN UNUSUAL/INAPPROPRIATE TIME (the days immediately after birth, when a woman is "emotionally distraught and peculiarly vulnerable"). NOTE the traps (verified against the opinion): it was NOT "insistent demand to finish AT ONCE" (the campaign ran 5 days, not at once), and NOT "multiple persuaders" (the court pinned it on ONE trusted counselor — "this concentrated assault… came from a person to whom plaintiff was encouraged to look for guidance"). Rule: undue influence is justified only where the actor\'s free agency and will are destroyed/subverted so the act expresses the influencer\'s will, not the actor\'s.'},
      {t:'case', n:'Gallon v. Lloyd-Thomas Co. (8th Cir. 1959) — DURESS is VOIDABLE + RATIFICATION (required + quiz-tested). Gallon was pressured into signing a reduced-compensation contract after executives told him he was under investigation for bigamy and likely to be deported (causing an anxiety breakdown). Held: even assuming duress, Gallon RATIFIED the contract — after the duress was removed he continued working, accepted its benefits, and never sought to void it for a considerable time despite having an attorney. RULE: a contract entered into under duress is NOT void but merely VOIDABLE, and it is capable of being RATIFIED after the duress is removed (by accepting benefits, or silence/acquiescence for a considerable time once free to annul). Quiz traps: duress makes a contract VOIDABLE, not void; and ratification\'s essential element is INTENTION (shown through conduct), NOT "conduct rather than intention."'},
      {t:'exam', n:'📝 MODULE 11 ESSAY REVIEW — the METHOD (Prof., worked model essay; Promo v. Stuff Mart). (1) READ THE INTERROGATORY FIRST, then the facts — the interrogatory gives the FOCUS, the facts give the CONTEXT. (2) Identify the parties (P = Promo, D = Stuff Mart); claims by anyone else in the facts are OUT OF SCOPE; claims by the defendant only matter as DEFENSES. (3) Answer the "QUESTION BEHIND THE QUESTION" first — is there a VALID CONTRACT? — because you can\'t say who prevails until you know a contract exists. (4) IRAC the metatopic (formation), and give EVERY topic/subtopic its OWN mini-IRAC paragraph.'},
      {t:'exam', n:'📝 Mod 11 essay — IRAC mechanics (Prof.): ISSUE = just the parties + the idea of a valid/enforceable contract; put NO facts in the issue (you may reuse the interrogatory). RULE = TWO parts: (a) the APPLICABLE LAW (UCC governs goods; common law governs everything else) and (b) the REQUIREMENTS FOR FORMATION. As of Module 11 those requirements are MUTUAL ASSENT + CONSIDERATION + ABSENCE OF DEFENSES to formation (Module 6 had only the first two — the added piece is defenses). A rule is a statement of GENERAL applicability, NOT tied to the facts.'},
      {t:'exam', n:'📝 Mod 11 essay — APPLICABLE LAW mini-IRAC + MERCHANT status. Custom-printing the mugs alone is NOT enough of a service component to make it a hybrid contract → it is a contract for GOODS → UCC governs. Because it is the UCC, check MERCHANT status (UCC 2-104 — three ways: deal in goods of the kind; hold yourself out as having expertise; or hire an agent who does). Promo (makes custom mugs) and Stuff Mart (retail home-goods seller) both "deal in goods of the kind," so BOTH are merchants. Put merchant status under applicable law because, like the UCC itself, it changes WHICH rules apply (or raise it the first time it becomes relevant).'},
      {t:'exam', n:'📝 Mod 11 essay — OFFER analysis (walk each communication chronologically as a potential offer; rule for a valid offer stated once, then applied). (a) Promo\'s WEBSITE AD = invitation to deal, not an offer: no identifiable offeree (anyone could see it), no specific quantity ("quantity discounts"), no specific subject matter ("full range of customizable mugs"). (b) Sal\'s EMAIL fixes subject matter (Model 26) + quantity (10,000) but ASKS PROMO FOR A PRICE → seeking a price QUOTE shows no intent to be bound, and because gap-filling a price applies ONLY to offers, the missing price can\'t be gap-filled → not an offer. (c) Pat\'s PRICE MATRIX (16 prices, 1,000–50,000 units, full- vs single-color) REINTRODUCES ambiguity on quantity and subject matter → not an offer (a step backwards). (d) Sal\'s REPLY "let\'s do 10,000 full-color" supplies the specific subject matter + quantity; all other terms already in context → VALID OFFER. The call getting cut off is an intentional RED HERRING (Sal never returned or complained of miscommunication).'},
      {t:'exam', n:'📝 Mod 11 essay — ACCEPTANCE, CONSIDERATION, DEFENSES. ACCEPTANCE: under UCC 2-206, absent a contrary statement, an offer to buy goods may be accepted by SHIPMENT — Promo shipping the first 5,000 mugs accepted Stuff Mart\'s (Sal\'s) offer → mutual assent. CONSIDERATION (mini-IRAC each of the two requirements): BARGAINED-FOR EXCHANGE (the 10,000 mugs for $10,000; each promise induced the other) + LEGALLY SUFFICIENT VALUE (mugs = detriment to Promo/benefit to Stuff Mart; $10,000 = detriment to Stuff Mart/benefit to Promo). DEFENSES: discuss only those the facts raise — here the STATUTE OF FRAUDS (goods $500+).'},
      {t:'exam', n:'📝 Mod 11 essay — STATUTE OF FRAUDS analysis (the model). TRIGGER: goods valued $500+. WRITING requirement: identify the parties, be signed by the party to be charged, and state the subject matter + quantity (UCC gap-fills price/other terms). Here there was NO sufficient writing (oral phone offer + acceptance by shipment). Then check EXCEPTIONS — the GENERAL exception (detrimental reliance/promissory estoppel — not supported here) PLUS the goods-specific exceptions unique to the $500+ trigger: (1) specially-manufactured goods, (2) merchant\'s confirming memo, (3) PART PERFORMANCE. PROFESSOR\'S ANSWER: the operative exception is SPECIALLY MANUFACTURED GOODS - the mugs are custom-branded for Stuff Mart (not resaleable) and Promo made a SUBSTANTIAL BEGINNING by manufacturing/shipping them, so the oral $500+ contract is enforceable WITHOUT a writing. (Part performance is an alternative but only enforces to the extent performed; promissory estoppel fails for lack of reliance facts.) CONCLUSION: a valid contract exists; Promo prevails and may enforce the contract; Stuff Mart\'s cancellation and refusal to pay is a breach.'},
      {t:'grade', n:'📝 GRADED — Mod 11 Essay (Score: 60/100). PROFESSOR\'S FEEDBACK (two corrections): (1) OFFER/ACCEPTANCE (biggest miss) — I did not properly determine WHO made the offer, so I concluded the wrong party accepted. The valid offer was SAL\'s (Stuff Mart\'s) phone reply "Let\'s do 10,000, full-color"; PROMO then accepted by SHIPPING the first 5,000 custom mugs (UCC 2-206). I had the offeror/offeree reversed. (2) STATUTE OF FRAUDS EXCEPTION — I put PROMISSORY ESTOPPEL, but there are no reliance facts, so it fails. The CORRECT exception is SPECIALLY MANUFACTURED GOODS: the mugs are custom-branded for Stuff Mart and Promo made a substantial beginning manufacturing/shipping them, so the oral $500+ contract is enforceable without a writing. (3) Consideration was fine. LESSON: pin down who the offeror is before analyzing acceptance; and when goods are custom-made, reach for the specially-manufactured-goods SOF exception, not promissory estoppel. Full corrected model answer PDF: Desktop + OneDrive/Bar Prep Guides, "CL610 Mod 11 - Model Essay (Promo v Stuff Mart)".'},
      {t:'case', n:'Chandelor v. Lopus (Ex. Ch. 1603, 79 Eng. Rep. 3) — affirmation vs. WARRANTY. A seller sold a stone, affirming it was a bezoar stone; it was not. HELD: "the bare affirmation that it was a bezar-stone, without warranting it to be so, is no cause of action." A mere affirmation of quality is NOT a warranty; absent an express warranty (or scienter for deceit), the buyer had no remedy. An early caveat-emptor landmark.'},
      {t:'case', n:'Cousineau v. Walker (Alaska 1980, 613 P.2d 608) — MISREPRESENTATION and justifiable reliance. In a land sale the seller\'s listing overstated the highway frontage and recoverable gravel; the buyer relied without independently verifying. HELD: a buyer is entitled to RELY on a seller\'s positive assertions of fact and generally need not investigate; a material misrepresentation (even innocent) justifies rescission.'},
      {t:'case', n:'Wood v. Boynton (Wis. 1885, 64 Wis. 265) — mistake as to VALUE (no rescission). A woman sold a small uncut stone for $1; both were uncertain what it was, and it turned out to be an uncut diamond worth ~$700. She sued to rescind. HELD: no rescission — absent FRAUD or a mutual mistake as to the IDENTITY of the thing sold, a mere mistake as to VALUE of a completed sale does not void it. The parties knowingly bore the risk of the unknown.'},
      {t:'case', n:'Hoffman v. Chapman (Md. 1943, 182 Md. 208) — REFORMATION for mutual mistake. The parties agreed to sell only PART of Lot 4, but the title company\'s drafter mistakenly drew a deed conveying the ENTIRE lot; the buyers refused to reconvey the extra. HELD: equity will REFORM a written instrument to conform to the parties\' true agreement where clear/convincing evidence shows a MUTUAL mistake; the scrivener\'s error was the mistake of all parties. Deed reformed.'}
    ]},
    { w:12, topic:'Performance — Express Conditions', tags:['express conditions','conditions','satisfaction','strict compliance'], notes:[
      {t:'concept', n:'📖 Reading — Ferriell §§8.01–8.04, §8.06 (Express Conditions). Required: Holmes, The Common Law (pp. 315–316, 338–339); Audette v. L\'Union St. Joseph; Inman v. Clyde Hall Drilling; New York Bronze Powder v. Benjamin Acquisition; Thos. J. Dyer v. Bishop Int\'l Eng\'g; FRCP 9(c); J.J. Shane v. Aetna; Gray v. Gardner; Hale v. Finch.'},
      {t:'concept', n:'Module 12 — EXPRESS CONDITIONS (§§8.01–8.04, 8.06): events that must occur before a duty arises; express vs. constructive conditions; strict compliance and conditions of satisfaction.'},
      {t:'exam', n:'📋 Module 12 (Express Conditions): Graded — Resource Quiz (10 pts); Seminar (2 pts).'},
      {t:'rule', n:'Seminar 12 — CONDITION vs. PROMISE (the key distinction): An unfulfilled PROMISE results in a BREACH of contract (damages). An unsatisfied CONDITION is NOT itself a breach — it means no duty arises (condition precedent) or a duty that had arisen is removed/discharged (condition subsequent).'},
      {t:'rule', n:'Seminar 12 — CONDITION PRECEDENT: an event that must occur BEFORE a duty to perform arises; if it does not occur, the conditioned duty never arises. Signal language: "provided that," "on the condition that," "subject to." Hypo: "I agree to buy the house provided that construction is complete on or before August 15th" — if the house is not finished by Aug 15, the buyer\'s duty to buy never arises (no breach by buyer).'},
      {t:'rule', n:'Seminar 12 — CONDITION SUBSEQUENT: an event that, if it occurs, EXTINGUISHES a duty that had already arisen. Signal language: "provided however that…" Hypo: "I agree to buy in monthly $1,000 installments for 20 years, provided however that the foundation remains stable" — if the foundation later fails, the buyer\'s existing duty to keep paying is discharged.'},
      {t:'case', n:'Thos. J. Dyer v. Bishop International Eng\'g, 303 F.2d 655 (6th Cir. 1962) — Seminar 12 focus. Bishop (general contractor) hired Dyer (plumbing subcontractor); the contract said Dyer would not be paid until five days after the OWNER paid Bishop. The owner paid Bishop but never paid for the plumbing, so Bishop never paid Dyer. Main point: contract provisions making performance CONDITIONAL on the occurrence of an event are enforceable, BUT the condition must be CLEARLY STATED. (Courts are reluctant to read a "pay-when-paid" clause as a true condition precedent that shifts the risk of the owner\'s insolvency onto the subcontractor unless the language is unmistakably clear.)'},
      {t:'exam', n:'Seminar 12 — EXPRESS CONDITION of SATISFACTION vs. silence: an express condition ("Buyer\'s duty to pay $20,000 is subject to the car being certified by Buyer\'s mechanic as in good working order") must be strictly satisfied before the duty arises. But if the writing is SILENT on the car\'s condition, there is no express condition — the buyer\'s remedy for a barely-functioning engine lies in warranty, not a failed condition.'},
      {t:'exam', n:'Seminar 12 — MCQ strategy: read the question carefully; eliminate wrong answers; don\'t make assumptions; watch qualifiers (all/none/always/only); avoid changing answers; answer every question; review if time allows.'},
      {t:'concept', n:'Seminar 12 conclusion: Promises not fulfilled = BREACH. Conditions not satisfied = NO duty arising (condition precedent) or REMOVAL of a duty already arisen (condition subsequent).'},
      {t:'concept', n:'Mod 12 video — THE THREE-STEP CONTRACT ANALYSIS (every essay or MCQ): (1) CONTRACT FORMATION (is there an enforceable contract?); (2) PERFORMANCE & BREACH (now that we know the terms and each party\'s duties, did they perform to the required standards — the FIRST issue here is CONDITIONS); (3) REMEDIES. You only reach performance & breach once a valid, enforceable contract exists.'},
      {t:'rule', n:'Mod 12 video — CONDITIONS OF PERFORMANCE are NOT formation conditions (Holmes, The Common Law): a condition attached to a contract COMING INTO BEING (e.g., "I\'ll repay the $500 if I feel like it") can make a promise ILLUSORY and prevent a contract from ever forming — that is a FORMATION problem. The conditions studied in performance & breach PRESUPPOSE a valid contract; they affect a party\'s DUTY TO PERFORM, not whether the contract is void.'},
      {t:'rule', n:'Mod 12 video — a CONDITION is a future event that affects a party\'s duty to perform. Analyze any condition by THREE factors: (1) TIMING, (2) MAKING, and (3) SATISFACTION. Every condition must be described by AT LEAST TWO factors — one TIMING factor + one MAKING factor (e.g., an "express condition precedent"). Naming only one (e.g., just "condition subsequent") tells you only part of how it works.'},
      {t:'rule', n:'Mod 12 video — TIMING (three types): (1) CONDITION PRECEDENT = the TRIGGER; no duty to perform until it occurs ("it lights the rocket"). Ex: I\'ll loan you $50,000 provided that on May 1 my home has at least $75,000 equity; the appraisal shows only $60,000 → condition failed → no duty to loan. (2) CONDITION CONCURRENT = both performances happen at the SAME time (I hand over the car as you pay the $10,000); most everyday contracts are concurrent and easy to overlook. (3) CONDITION SUBSEQUENT = a CUTOFF that ends an already-existing duty. Ex: an insurance policy requires reporting a theft within 10 days — report on day 5 → insurer must pay; report on day 20 → the duty to pay is cut off.'},
      {t:'rule', n:'Mod 12 video — MAKING: EXPRESS conditions. An express condition is one the parties EXPRESSLY stated (spoken or written) — obvious and identifiable. Express conditions require STRICT COMPLIANCE; substantial performance is NOT enough. Ex: "I\'ll buy your computer for $500 if you update its virus-protection software" — paying for and downloading the update is not enough; if it is not actually INSTALLED, the express condition precedent is not strictly satisfied and the duty to pay never arises.'},
      {t:'rule', n:'Mod 12 video — GOOD FAITH & REASONABLE EFFORTS on a condition a party controls: a party whose own conduct can bring about a condition has an implied duty to act in GOOD FAITH and use REASONABLE EFFORTS to make it occur. Failing to do so — deliberately (to escape the deal) OR through neglect/distraction — WAIVES the condition AND puts that party in BREACH, so the other side can enforce the contract as if there were no condition. (You cannot use your own bad faith to escape; but reasonable efforts has limits — you need not pay $500 to update software you bought for $50.)'},
      {t:'concept', n:'Mod 12 video — CONTROL SPECTRUM of express conditions (all still require strict compliance): (a) WITHIN a party\'s control (update the software); (b) PARTLY within control (buyer\'s duty to pay conditioned on getting a $10,000 bank loan — buyer must apply in good faith/with reasonable effort, but the BANK\'s approval is outside the parties\' control); (c) BEYOND the parties\' control (I\'ll sell you my Dodgers postseason tickets at face value IF the Dodgers reach the postseason — no one controls that). The good-faith/reasonable-efforts duty attaches only to the part a party actually controls.'},
      {t:'rule', n:'§8.01 CONDITION — DEFINITION (Ferriell Ch. 8; Rest. 2d §224): an event, NOT certain to occur, which must occur (unless its non-occurrence is excused) BEFORE performance under a contract becomes due. It is the "if" in an if-then statement. Conditions allocate risk and control the SEQUENCE of performance. They may be EXPRESS (stated) or CONSTRUCTIVE (imposed by law, e.g., the seller\'s tender is a constructive condition of the buyer\'s duty to pay). Failure of a condition is NOT a breach and gives no damages, unless a party also PROMISED the event would occur (Merritt Hill Vineyards v. Windy Heights).'},
      {t:'rule', n:'§8.01[B] USES OF CONDITIONS: (1) SEQUENCE — fix the order of performance (owner\'s duty to pay conditional on the contractor finishing; progress payments); (2) EXCUSE/RISK-ALLOCATION — let a party escape a duty (a home purchase conditioned on the buyer qualifying for a mortgage or selling her current home); (3) PROCEDURAL — notice/proof mechanisms (insurance: prompt notice, preserving damaged property, timely premiums); (4) ALTERNATIVE PERFORMANCES (Gray v. Gardner); (5) ENSURING SATISFACTION (wedding photos, architect\'s plans).'},
      {t:'rule', n:'§8.01[C] CONSEQUENCES OF A CONDITION\'S FAILURE (Rest. 2d §225): (1) SUSPENSION — the duty subject to the condition is not due until the condition occurs; (2) DISCHARGE — if the condition can no longer occur, the duty is DISCHARGED (Luttinger v. Rosen — the buyer\'s duty never matured when the mortgage-financing condition failed; non-purchase was not a breach). Mere non-occurrence gives NO damages unless the responsible party also PROMISED to make it happen. EXPRESS conditions must be STRICTLY (literally) performed — no substantial compliance (Oppenheimer & Co. v. Oppenheim).'},
      {t:'rule', n:'§8.02 CONDITIONS vs. PROMISES. Promises CREATE duties; conditions LIMIT them. Breach of a PROMISE gives a remedy (damages); failure of a CONDITION merely excuses the other party\'s duty (and can cause forfeiture), with NO damages. Signal words for a condition: "on condition that," "unless," "subject to," "provided that," "if." CONSTRUCTION-AS-PROMISE PREFERRED (Rest. §227): because a failed condition is harsh, AMBIGUOUS language is construed as a PROMISE (Rohauer v. Little). PROMISSORY CONDITIONS are both — breach excuses the other party AND gives a damages remedy.'},
      {t:'rule', n:'§8.02[B] TIME FOR PERFORMANCE & PAY-WHEN-PAID. "Time is of the essence" usually makes the deadline a CONDITION (delay discharges), but courts avoid using it to cause forfeiture; otherwise late performance gives only a damages claim. PAY-WHEN-PAID clauses (sub paid "when the general receives payment from the owner"): usually construed as PROMISES fixing a reasonable TIME for payment, not conditions (Peacock Construction). To truly shift the risk (pay-IF-paid), the parties must say so UNAMBIGUOUSLY (contrast J.J. Shane with Thos. J. Dyer).'},
      {t:'rule', n:'§8.03[A] CLASSIFYING CONDITIONS BY OPERATION. (1) CONDITION PRECEDENT — must occur BEFORE a duty matures (most conditions; Schmidt v. J.C. Robinson Seed). (2) CONDITION SUBSEQUENT — EXCUSES/terminates a duty already matured (Rest. §230). (3) CONCURRENT CONDITIONS — both parties perform simultaneously, each a constructive condition of the other (§§2-507, 2-511). The precedent/subsequent distinction usually matters only for BURDEN OF PROOF: the party enforcing the promise proves a condition precedent occurred; the party avoiding its duty proves a condition subsequent occurred.'},
      {t:'rule', n:'§8.03[B] CLASSIFYING CONDITIONS BY SOURCE. (1) EXPRESS — spelled out ("express condition," "subject to," "if"); must be strictly/literally performed (Oppenheimer). (2) IMPLIED (implied-in-fact) — a true condition derived from the parties\' INTENT as shown by conduct/context (Taylor v. Caldwell framed impossibility as an "implied condition"; the good-faith/no-hindrance duty — Zobel & Dahl v. Crotty). (3) CONSTRUCTIVE (implied-in-law) — imposed by the court from the promises to structure the order of performance (developed in Week 13; Kingston v. Preston).'},
      {t:'rule', n:'§8.04 CONDITIONS OF SATISFACTION/APPROVAL — two standards. (a) PERSONAL TASTE / AESTHETICS (portrait, wedding photos) → SUBJECTIVE standard: the promisor need only be HONESTLY dissatisfied, i.e., act in GOOD FAITH (Mattei v. Hopper). (b) FUNCTIONAL/COMMERCIAL UTILITY (machine works, building sound) → OBJECTIVE standard: whether a REASONABLE PERSON would be satisfied (Rest. §228; Morin Building Products v. Baystone). Watch forfeiture. THIRD-PARTY satisfaction (architect\'s certificate) → usually subjective/good-faith.'},
      {t:'rule', n:'§8.06 CONDITIONS IN INTERNATIONAL TRANSACTIONS. Like UCC Article 2, the CISG has no specific rules on conditions (Art. 7 defers gaps). But: Art. 8 — promise vs. condition turns on the parties\' intent as a reasonable person would understand it; Arts. 53 & 58 — payment and delivery are CONCURRENT constructive conditions absent contrary agreement; Arts. 49 & 64 — a party may terminate for the other\'s "fundamental breach." PICC/PECL likewise turn on party intent, treat performances as concurrent, and impose good-faith/cooperation duties.'},
      {t:'case', n:'Merritt Hill Vineyards v. Windy Heights Vineyard (N.Y. 1984, 460 N.E.2d 1077) — failure of a CONDITION is NOT a breach. A stock-purchase agreement made the buyer\'s duty to close conditional on the seller\'s obtaining a title-insurance policy and a mortgage confirmation; those conditions were not met and the buyer sued for damages. HELD: the seller had not PROMISED those events, only made them conditions of the buyer\'s duty, so their non-occurrence excused the buyer\'s performance (buyer got its deposit back) but was NOT a breach entitling the buyer to damages.'},
      {t:'case', n:'Luttinger v. Rosen (Conn. 1972, 316 A.2d 757) — DISCHARGE by a failed condition. Buyers promised to purchase land subject to an EXPRESS condition that they obtain first-mortgage financing of $45,000 for at least 20 years at no more than 8.5% interest; they tried but could not. HELD: because the express condition was not satisfied, the buyers\' duty never matured; their failure to proceed was NOT a breach and they recovered their deposit.'},
      {t:'case', n:'Oppenheimer & Co. v. Oppenheim, Appel, Dixon & Co. (N.Y. 1995, 660 N.E.2d 415) — EXPRESS CONDITIONS MUST BE LITERALLY (STRICTLY) PERFORMED. A sublease was conditioned on the sublessor delivering the landlord\'s WRITTEN consent by a deadline; oral notice was timely but the written consent came 23 days late. HELD: the express condition was not satisfied and the duty was discharged — no "substantial performance" of an express condition ("Express conditions must be literally performed, whereas constructive conditions... are subject to... substantial compliance"). A failed PURE condition gives no damages.'},
      {t:'case', n:'Rohauer v. Little (Colo. 1987, 736 P.2d 403) — CONSTRUCTION AS PROMISE PREFERRED. A land-sale agreement said a title abstract "shall be furnished on or before July 10, 1981"; the seller missed the deadline and the buyer backed out. HELD: because the "shall be furnished" language was not unequivocally a condition, it was construed as a PROMISE — letting the seller attempt to show substantial performance and avoiding the harsh forfeiture of an express condition.'},
      {t:'case', n:'Peacock Construction Co. v. Modern Air Conditioning (Fla. 1977, 353 So.2d 840) — PAY-WHEN-PAID construed as a promise. A subcontract made the general\'s payment to the sub turn on the general\'s receipt of payment from the owner. HELD: absent clear language shifting the risk, such a clause fixes only a reasonable TIME for payment; "small contractors, who must have payment for their work to remain in business, will not ordinarily assume the risk of the owner\'s failure to pay."'},
      {t:'case', n:'Schmidt v. J.C. Robinson Seed Co. (Neb. 1985, 370 N.W.2d 103) — defines CONDITION PRECEDENT: "a condition which must be performed before the parties\' agreement becomes a binding contract, or a condition which must be fulfilled before a duty to perform an existing contract arises." If it does not occur, the duty subject to it never becomes due.'},
      {t:'case', n:'Mattei v. Hopper (Cal. 1958, 330 P.2d 625) — SATISFACTION clause and illusoriness. A real-estate purchase was made subject to the buyer obtaining leases "satisfactory" to him; the seller argued the promise was illusory. HELD: a satisfaction condition does NOT make a promise illusory — it is limited by a standard (OBJECTIVE reasonableness for commercial value; SUBJECTIVE good faith for personal taste), so the promisor is bound to judge honestly/reasonably and consideration exists.'},
      {t:'case', n:'Morin Building Products Co. v. Baystone Construction (7th Cir. 1983, 717 F.2d 413, Posner, J.) — which SATISFACTION standard applies. A contract to erect aluminum walls on a GM plant let GM reject work not to its "satisfaction"; GM rejected on aesthetic grounds. HELD: despite the satisfaction language, an OBJECTIVE reasonableness standard applied because the subject matter (industrial siding) concerned commercial quality, not artistic taste.'},
      {t:'case', n:'Audette v. L\'Union St. Joseph (Mass. 1901, 178 Mass. 113, Holmes, C.J.) — an EXPRESS CONDITION not excused by impossibility of a third party\'s act. A benefit society\'s bylaw made a sworn physician\'s certificate a condition of sick benefits; the member\'s doctor refused on religious grounds to swear it. HELD: the certificate was a genuine express condition, and the inability to obtain a stranger\'s act — without any interference by the society — did NOT excuse it; the claim was premature.'},
      {t:'case', n:'Inman v. Clyde Hall Drilling Co. (Alaska 1962, 369 P.2d 498) — enforcing an express CONDITION PRECEDENT. An employment contract required written notice of any claim within 30 days and expressly made that notice "a condition precedent to any right of action"; Inman sued without giving notice. HELD: the provision was a valid express condition precedent, enforced as written absent unconscionability/public-policy violation; suit barred.'},
      {t:'case', n:'New York Bronze Powder Co. v. Benjamin Acquisition Corp. (Md. 1998, 351 Md. 452) — the PREFERENCE AGAINST conditions (to avoid forfeiture). A promissory note said the holder must surrender the note "in order to receive payment"; the obligor argued surrender was a condition precedent. HELD: doubtful language is construed as a PROMISE (covenant), not an express condition — especially where reading it as a condition would cause forfeiture; surrender was a covenant, so failure to surrender did not excuse payment (Rest. §227).'},
      {t:'case', n:'J.J. Shane, Inc. v. Aetna Casualty & Surety Co. (Fla. App. 1998, 723 So.2d 302) — a true "PAY-IF-PAID" CONDITION. The subcontract said the sub was "relying upon the financial responsibility of Owner" and that payment "is to be made from funds received from Owner by Contractor." HELD: this language PLAINLY made the owner\'s payment an express CONDITION PRECEDENT to the GC\'s duty to pay the sub, shifting the risk of the owner\'s nonpayment onto the sub. The foil to Dyer.'},
      {t:'case', n:'Gray v. Gardner (Mass. 1821, 17 Mass. 188) — burden of proof on a CONDITION SUBSEQUENT. Buyers of whale oil promised an additional sum UNLESS a greater quantity of oil arrived by ship at designated ports before a set date (arrival would discharge the extra payment). HELD: the party seeking to be DISCHARGED by the happening of the condition subsequent bears the burden of proving it occurred; arrival not proven in time → the additional payment was due.'},
      {t:'case', n:'Hale v. Finch (U.S. 1881, 104 U.S. 261) — CONDITION vs. COVENANT. A bill of sale of the steamboat "New World" was made "upon the express condition" the vessel not be run on California waters for ten years; it later was. HELD: the "express condition" language created a bare CONDITION (giving a right to reclaim the property on breach), NOT a COVENANT imposing personal liability on the buyer, who made no promise of his own.'}
    ]},
    { w:13, topic:'Performance — Constructive Conditions & Quasi-Contract Recovery', tags:['constructive conditions','substantial performance','material breach','quasi-contract','Jacob & Youngs'], notes:[
      {t:'concept', n:'📖 Reading — Ferriell §§8.02, 8.03, §§9.01–9.04 (Constructive Conditions & Quasi-Contract). Required cases: Stewart v. Newbury; Monroe Street Properties v. Carpenter; Jacob & Youngs v. Kent; Walker & Co. v. Harrison; K&G Construction v. Harris; Bartus v. Riccardi; Parker v. Bell Ford; Scavenger v. GT Interactive; Britton v. Turner.'},
      {t:'concept', n:'Module 13 — CONSTRUCTIVE CONDITIONS & QUASI-CONTRACT (§§8.02–8.03, 9.01–9.04): order of performance, substantial performance vs. material breach (Jacob & Youngs v. Kent), and restitution/quasi-contract recovery (Britton v. Turner).'},
      {t:'exam', n:'📋 Module 13 (Constructive Conditions & Quasi-Contract Recovery): Graded — Resource Quiz (10 pts); Module Quiz (20 pts); Seminar (2 pts).'},
      {t:'rule', n:'Mod 13 video — MAKING of conditions, the three ways a condition is made: (1) EXPRESS (expressly stated in the agreement); (2) IMPLIED (better: IMPLIED-IN-FACT — implicit from the particular TERMS of the contract); (3) CONSTRUCTIVE (implied-in-law — implied by the COURTS from the parties\' performances). STANDARD differs: express and implied-in-fact require STRICT compliance; constructive requires only SUBSTANTIAL performance.'},
      {t:'rule', n:'Mod 13 video — IMPLIED (implied-in-fact) CONDITIONS: a condition implicit from the contract\'s particular terms. Ex: you hire me to paint your house and agree to SUPPLY the paint; though the contract says nothing about conditions, supplying the paint is an IMPLIED condition precedent to my duty to paint (I can\'t paint without paint) — if you never provide it, my duty never matures. Implied-in-fact conditions are treated like EXPRESS conditions (STRICT performance), so courts often lump them together — and a party wanting strict performance will argue a non-express condition is "implied-in-fact." (Courts DISFAVOR this and PREFER to find a constructive condition where none is expressly stated.)'},
      {t:'rule', n:'Mod 13 video — CONSTRUCTIVE (implied-in-law) CONDITIONS: implied by the COURTS from the relative PERFORMANCES of the parties (not from the words). They require only SUBSTANTIAL performance. This is the "every contract has conditions" idea — constructive conditions are almost always present. THREE situations create one: (1) one party\'s performance PRECEDES the other\'s → the earlier is a constructive condition precedent to the later (I deliver the watch Tuesday, you pay Friday — no delivery Tuesday, no duty to pay Friday); (2) one party\'s performance takes LONGER → the longer performance is a constructive condition to the shorter (you paint my house, I pay $500 — painting takes longer than paying, so finishing the painting is a condition precedent to my duty to pay); (3) performances are SIMULTANEOUS/instantaneous → each is constructively conditioned on the other (car for $5,000 Saturday, tender keys and money at the same time — if I don\'t tender the keys, you needn\'t tender the money, and vice versa).'},
      {t:'rule', n:'Mod 13 video — QUASI-CONTRACT recovery (the fallback when performance falls short): a party whose performance has NOT risen to the required level (strict for express/implied-in-fact; substantial for constructive) cannot recover ON the contract, but may recover in QUASI-CONTRACT the FAIR VALUE of the performance it provided before the breach. TRADITIONAL rule: only the NON-breaching party can recover (a wrongdoer may not profit from his own wrong). MODERN rule (Britton v. Turner): even a BREACHING party may recover the fair value of performance provided, but ONLY to the extent the benefit conferred EXCEEDS the non-breaching party\'s losses caused by the breach.'},
      {t:'concept', n:'Mod 13 video — CONDITIONS SUMMARY (two axes): describe every condition by (A) how it was MADE — express / implied-in-fact / constructive — AND (B) its TIMING — precedent / concurrent / subsequent. Strict compliance for express + implied-in-fact; substantial performance for constructive; quasi-contract if the required standard is not met.'},
      {t:'rule', n:'§8.03[B][3] CONSTRUCTIVE CONDITIONS (implied-in-law) — imposed by the court, derived from the parties\' promises and circumstances, to structure the ORDER of performance and prevent injustice. In a bilateral contract each party\'s substantial performance is a constructive condition of the other\'s duty (the promises are DEPENDENT, not independent). Historically promises were INDEPENDENT (Nichols v. Raynbred); the shift to dependent/constructive conditions (Kingston v. Preston, Lord Mansfield) was a milestone of modern contract law.'},
      {t:'case', n:'Nichols v. Raynbred (K.B. 1615, Hob. 88) — the OLD independent-promises rule. In a sale of a cow, the seller was allowed to sue to recover the price WITHOUT proving he had delivered the cow, because the buyer\'s promise to pay had not been made expressly conditional on delivery. Illustrates the pre-modern view that mutual promises were INDEPENDENT — a trap later fixed by constructive (dependent) conditions.'},
      {t:'case', n:'Kingston v. Preston (K.B. 1773, 2 Doug. 689, Lord Mansfield) — the birth of CONSTRUCTIVE CONDITIONS. A merchant agreed to sell his business to an employee on deferred credit, the buyer promising to provide "satisfactory security"; the buyer sued for conveyance without tendering the security. HELD (Mansfield): the buyer\'s promise to give security was a CONDITION PRECEDENT to the seller\'s duty to convey — to hold otherwise "would be the greatest injustice." Established that reciprocal promises are ordinarily DEPENDENT.'},
      {t:'rule', n:'§9.01 THE EFFECT OF BREACH (Ferriell Ch. 9). Full performance DISCHARGES a party\'s duties. Any non-performance not excused is a BREACH, and EVERY breach — however trivial — entitles the injured party to damages (even nominal). But only a MATERIAL breach lets the injured party suspend or cancel. Three categories: (1) NON-MATERIAL/partial → damages only; (2) CURABLE material → damages + right to SUSPEND while awaiting cure; (3) TOTAL material (incurable/uncured) → damages + right to CANCEL. "Substantial performance" and "material breach" are two sides of the same coin (Farnsworth).'},
      {t:'rule', n:'§9.01[A] MATERIALITY FACTORS (Rest. (2d) §241): (a) the extent to which the injured party is DEPRIVED OF THE BENEFIT it reasonably expected (the MOST important — did partial performance satisfy the essential purpose?); (b) adequacy of money DAMAGES; (c) FORFEITURE to the breaching party; (d) ability/willingness to CURE; (e) GOOD FAITH. No mathematical formula (Plante v. Jacobs). CAUTION: a party who wrongly SUSPENDS becomes the material breacher itself.'},
      {t:'rule', n:'§9.01 DELAY as breach. Whether late performance is material turns first on whether "TIME IS OF THE ESSENCE"; a boilerplate TOE clause does NOT automatically make a short, harmless delay material. Late PAYMENT in an ACCORD: a short, harmless delay is not material and does not revive the original debt (Associated Builders v. Coggins). A delayed construction PROGRESS PAYMENT is more serious, and an owner\'s outright refusal is almost always material. WILLFULNESS: Cardozo (Jacob & Youngs) said a willful transgressor cannot invoke substantial performance; the modern Rest. view treats good faith as one §241 factor.'},
      {t:'rule', n:'§9.01[D] DIVISIBILITY. A material breach of ONE divisible part does not discharge duties as to OTHER parts. Two-factor test (Rest. §240): (1) performances separable into corresponding PAIRS, and (2) the pairs regarded as AGREED EQUIVALENTS. Tipton v. Feitner; Carrig v. Gilbert-Varker. NOT divisible where breach of one part substantially impairs the whole, or where the total is worth more than the sum of its parts.'},
      {t:'rule', n:'§9.01[E] RESTITUTION FOR PART PERFORMANCE. A party in MATERIAL breach cannot sue on the contract, but may recover in QUANTUM MERUIT the reasonable value of the benefit conferred, offset by the other party\'s damages (Kreyer v. Driscoll) — unless the defective work conferred no substantial benefit because it must be redone. (Cf. Britton v. Turner.)'},
      {t:'rule', n:'§9.01[F] FUNDAMENTAL BREACH (international). CISG Art. 25: a breach is "fundamental" if it substantially deprives the other party of what it was entitled to expect, and that result was foreseeable — permitting AVOIDANCE (Arts. 49 & 64). Mirrors the common-law TOTAL MATERIAL BREACH. UNIDROIT/PECL use similar factors and a "Nachfrist" notice procedure.'},
      {t:'rule', n:'§9.02 SELLER\'S TENDER (§2-503). Tender = put and hold conforming goods at the buyer\'s disposition and give reasonable notice. Time/manner/place per contract; if silent, a reasonable time at the SELLER\'S place of business. SHIPMENT contract → tender when goods given to the carrier (with documents); DESTINATION contract → tender at the destination. Large deals often use a DOCUMENTARY SALE (≈5 parties; bill of lading + draft + letter of credit).'},
      {t:'rule', n:'§9.02[A][2] THE PERFECT TENDER RULE (§2-601). In a SINGLE-delivery goods contract the buyer may reject if the goods OR the tender "fail in ANY respect to conform" — the defect need NOT be material (substantial performance does NOT apply). Buyer may reject the whole, accept the whole, or accept some units and reject the rest. Filley v. Pope; Ramirez v. Autosport. MITIGATED BY: merchantability/trade-usage leeway; the seller\'s RIGHT TO CURE (§2-508); inapplicability to installment contracts; strict notice-of-rejection rules; and the buyer\'s GOOD-FAITH duty.'},
      {t:'rule', n:'§9.02[A][3] INSTALLMENT CONTRACTS (§2-612). Perfect tender does NOT apply. The buyer may reject a single installment only if the defect "SUBSTANTIALLY IMPAIRS the value of THAT installment" and cannot be cured; may CANCEL the whole only if defects "substantially impair the value of the WHOLE contract" (Graulich Caterer; Midwest Mobile). A buyer\'s late PAYMENT for a delivered installment usually substantially impairs the whole to the seller.'},
      {t:'rule', n:'§9.02[B] PAYMENT & RIGHT TO INSPECT. Tender of payment is a condition of the seller\'s duty to deliver (§2-511, §2-507). The buyer usually has a right to INSPECT before paying (§2-513) — BUT in a DOCUMENTARY sale the buyer pays against the DOCUMENTS and may inspect only the documents (not the goods) before payment.'},
      {t:'rule', n:'§9.03[A]-[B] ACCEPTANCE & REJECTION. ACCEPTANCE (§2-606) occurs when the buyer (a) signifies the goods conform/will be kept, (b) FAILS to make an effective rejection after a reasonable chance to inspect, or (c) does any ACT INCONSISTENT WITH THE SELLER\'S OWNERSHIP (reselling, modifying). Once accepted, the buyer must pay — but keeps a damages claim (§2-714). REJECTION (§2-602) requires SEASONABLE, UNEQUIVOCAL notice within a reasonable time, and the buyer must STATE the defects (§2-605) or waive curable/ascertainable ones. Miron v. Yonkers Raceway.'},
      {t:'rule', n:'§9.03[C] REVOCATION OF ACCEPTANCE (§2-608). After acceptance, the buyer may revoke only if the defect SUBSTANTIALLY IMPAIRS the value to HIM (SUBJECTIVE standard) AND the buyer accepted either (a) on the reasonable assumption the defect would be CURED (and it was not), or (b) WITHOUT discovering it because it was hard to discover or because of the seller\'s ASSURANCES. Revoke within a reasonable time, before a substantial change in the goods (except a change caused by the defect). "SHAKEN FAITH" doctrine (new cars). Colonial Dodge v. Miller; Waddell v. L.V.R.V.'},
      {t:'rule', n:'§9.04 SELLER\'S RIGHT TO CURE (§2-508). A rightful rejection does NOT end the contract — the seller may usually CURE by a conforming delivery (or repair/price adjustment): (1) if the TIME for performance has not expired, on seasonable notice; OR (2) even AFTER the deadline, where the seller had "reasonable grounds to believe" the nonconforming tender would be acceptable — then a further reasonable time. Bartus v. Riccardi. But cure is LOST if not exercised within a reasonable time (Ramirez). (CISG Art. 37 broad cure before the date; Art. 48 limited cure after.)'},
      {t:'case', n:'Stewart v. Newbury (N.Y. 1917, 220 N.Y. 379) — order of performance when the contract is SILENT on payment. A construction contract said nothing about when payment was due; the contractor did excavation/foundation work, demanded a partial payment, was refused, and quit. HELD: where a contract for work requiring a period of time is silent on payment timing, substantial performance is a CONSTRUCTIVE CONDITION PRECEDENT to payment. The contractor who abandoned for nonpayment was in breach. Default rule: work first, then pay.'},
      {t:'case', n:'Monroe Street Properties, Inc. v. Carpenter (9th Cir. 1969, 407 F.2d 379) — CONCURRENT CONDITIONS and tender. Monroe was to exchange first mortgages for Western\'s stock; neither performed. HELD: where promises are concurrent conditions, a party cannot place the other in breach unless it has TENDERED, or was ready/able to tender, its own performance. Monroe, unable to convey clear title, could not hold Western in breach.'},
      {t:'case', n:'Jacob & Youngs v. Kent (N.Y. 1921, 230 N.Y. 239, Cardozo, J.) — SUBSTANTIAL PERFORMANCE. A builder mistakenly installed non-"Reading" brand pipe (comparable quality); the owner demanded the finished walls be torn out and redone. HELD: a trivial and innocent (non-willful) deviation does NOT forfeit recovery — the builder substantially performed. The remedy is the DIMINUTION IN VALUE (essentially nominal), not the wasteful cost of tearing out and replacing.'},
      {t:'case', n:'Walker & Co. v. Harrison (Mich. 1957, 347 Mich. 630) — what counts as a MATERIAL breach. Under a sign-rental/maintenance contract Walker was allegedly slow to service the sign; Harrison stopped paying and repudiated. HELD: Walker\'s lapse was NOT material, so Harrison\'s repudiation was itself the material breach. Materiality factors (Rest. §241). Treat a minor breach as material at your peril.'},
      {t:'case', n:'K&G Construction Co. v. Harris (Md. 1960, 223 Md. 305) — material breach suspends counter-performance. A subcontractor\'s employee negligently drove a bulldozer into the GC\'s house; the GC withheld a progress payment; the sub walked off. HELD: the sub\'s material breach EXCUSED the GC\'s duty to make that progress payment, so the sub\'s stopping work was wrongful. One party\'s uncured material breach suspends the other\'s dependent performance.'},
      {t:'case', n:'Bartus v. Riccardi (N.Y. City Ct. 1967, 55 Misc.2d 3) — the seller\'s right to CURE. A buyer ordered a particular hearing-aid model; the seller delivered a newer, improved model as a conforming substitute, which the buyer rejected. HELD: under UCC §2-508 a seller with reasonable grounds to believe a tender will be acceptable (or within the contract time) may CURE within a reasonable time; the buyer must accept a timely cure.'},
      {t:'case', n:'A.B. Parker v. Bell Ford, Inc. — NOTICE of breach as a condition of the buyer\'s remedy. A buyer of a new pickup with a defective wheel housing sued without ever notifying the dealer of the problem. HELD: under UCC §2-607(3)(a) a buyer who has accepted goods MUST, within a reasonable time, NOTIFY the seller or be BARRED from any remedy. (⚠ Confirm the state/citation against your casebook.)'},
      {t:'case', n:'Scavenger, Inc. v. GT Interactive Software (N.Y. App. Div. 2000, 273 A.D.2d 60) — DIVISIBLE (severable) contracts. The contract called for four CD-ROM games, each with its OWN production and payment schedule; the developer delivered two but not the other two. HELD: the agreement was DIVISIBLE as to each game — the developer could recover the guaranteed advances for the two delivered games.'},
      {t:'case', n:'Britton v. Turner (N.H. 1834, 6 N.H. 481) — RESTITUTION for a breaching party (the landmark). A laborer agreed to work one year for $120 but quit, without cause, after ~9.5 months. HELD: despite the entirety rule, the breaching employee may recover in QUANTUM MERUIT the reasonable value of services rendered, LESS the employer\'s damages — to prevent unjust enrichment and forfeiture. Foundation of Rest. (2d) §374.'},
      {t:'case', n:'Plante v. Jacobs (Wis. 1960, 103 N.W.2d 296) — SUBSTANTIAL PERFORMANCE. A home builder omitted some items (cabinets, gutters, closet rods) and misplaced a living-room wall by about a foot. HELD: substantial performance — "no mathematical rule" governs; the test is whether the defective performance satisfied the ESSENTIAL PURPOSE. The builder recovered the balance MINUS the cost to complete; for the misplaced wall (no effect on market value) damages were DIMINISHED VALUE.'},
      {t:'case', n:'O.W. Grun Roofing & Construction Co. v. Cope (Tex. Civ. App. 1975, 529 S.W.2d 258) — a COSMETIC defect can be MATERIAL. A new roof was installed with unsightly yellow streaks running through russet shingles; the only fix was to replace the whole roof. HELD: NOT substantial performance — a contractor whose work "can be remedied only by completely redoing the work" has not substantially performed, even though the defect was purely aesthetic.'},
      {t:'case', n:'Associated Builders, Inc. v. Coggins (Me. 1999, 722 A.2d 1278) — DELAY, ACCORD, and materiality. To settle a dispute, Coggins agreed to two $25,000 payments; timely payment would discharge a disputed additional $20,000. The second payment arrived 3 days late. HELD: applying Rest. §241, the 3-day delay caused no significant harm, so Coggins SUBSTANTIALLY PERFORMED the accord and the original duty was satisfied.'},
      {t:'case', n:'Tipton v. Feitner (N.Y. 1859, 20 N.Y. 423) — DIVISIBILITY. A sale combined "dressed" (slaughtered) hogs for immediate delivery at one price and live hogs for later delivery at another. HELD: DIVISIBLE into two parts, each with its own price treated as the agreed equivalent — so a breach as to one set did not discharge the duties as to the other.'},
      {t:'case', n:'Carrig v. Gilbert-Varker Corp. (Mass. 1943, 50 N.E.2d 59) — DIVISIBILITY of a construction contract. A builder contracted to build 35 houses but finished only 20 before abandoning. HELD: where the consideration is apportioned to each item as a separate unit (a price-per-house), the contract is SEVERABLE — recover for the houses completed while remaining liable for breach as to the rest.'},
      {t:'case', n:'Kreyer v. Driscoll (Wis. 1968, 159 N.W.2d 680) — RESTITUTION for a breaching contractor. A home builder left substantial plumbing, electrical, heating, tile, and flooring work undone — a MATERIAL breach. HELD: even so, the builder could recover in QUANTUM MERUIT for the value of work actually done (offset by the owner\'s damages), provided the work conferred a substantial benefit.'},
      {t:'case', n:'Filley v. Pope (U.S. 1885, 115 U.S. 213) — the PERFECT TENDER RULE. A contract for Scotch pig iron specified shipment "from Glasgow"; the seller instead shipped from Leith to New Orleans. HELD: the buyer was justified in refusing — even though the iron itself was fine, the tender did not conform to the contract term (port of shipment). An early anchor of the exact-conformity rule.'},
      {t:'case', n:'Ramirez v. Autosport (N.J. 1982, 440 A.2d 1345) — PERFECT TENDER + limits on CURE. A new camper van was delivered with scratched paint and missing hookups/hubcaps; the buyers rightfully rejected. The seller repeatedly promised the van would be ready but never delivered a conforming, ready van; the buyers cancelled. HELD: the seller had a RIGHT TO CURE but LOST it by failing to cure within a reasonable time.'},
      {t:'case', n:'Graulich Caterer, Inc. v. Hans Holterbosch, Inc. (N.J. 1968, 243 A.2d 253) — INSTALLMENT breach of the WHOLE. A caterer supplied German-style food (for a 1964 World\'s Fair pavilion) that did not match the approved samples; the first delivery was unappetizing and the second (2,000+ units) likewise defective. HELD: the recurring, uncorrected defects SUBSTANTIALLY IMPAIRED THE VALUE OF THE WHOLE contract, justifying cancellation under §2-612(3).'},
      {t:'case', n:'Miron v. Yonkers Raceway, Inc. (2d Cir. 1968, 400 F.2d 112) — ACCEPTANCE by failure to inspect/reject. The buyer of a racehorse did not have the horse\'s legs examined and did not reject it within a day of delivery. HELD: the buyer ACCEPTED by failing to inspect and reject within a reasonable time; a readily discoverable defect must be acted on promptly.'},
      {t:'case', n:'Colonial Dodge, Inc. v. Miller (Mich. 1984, 362 N.W.2d 704) — REVOCATION of acceptance. A buyer accepted a new car, then discovered it lacked a spare tire (hidden under a fastened panel). HELD: revocation was permitted — the missing spare tire SUBSTANTIALLY IMPAIRED the value to this buyer, and its hidden location explained why the defect was not discovered before acceptance (§2-608(1)(b)).'},
      {t:'case', n:'Waddell v. L.V.R.V. Inc. (Nev. 2006, 125 P.3d 1160) — REVOCATION after long, failed repairs. A new RV suffered an overheating engine and failing A/C, heating, and electrical systems; over ~18 months of failed repairs. HELD: revocation was proper — the defects substantially impaired the basic benefit of the bargain, and the buyers\' delay did NOT bar revocation because the time to revoke was TOLLED while the seller kept possession and tried to repair.'},
      {t:'rule', n:'Seminar 13 — MINOR vs. MATERIAL breach, the SIX FACTORS (Walker & Co. v. Harrison; Rest. §241): weigh (1) the extent the injured party will be DEPRIVED of the benefit reasonably expected; (2) the extent the injured party can be adequately COMPENSATED in damages; (3) the extent the breaching party has already PERFORMED (forfeiture); (4) HARDSHIP on the breaching party; (5) whether the breach was WILLFUL, negligent, or innocent (good faith); and (6) the LIKELIHOOD the breaching party will CURE / perform the rest. A MATERIAL breach discharges the other party (and it may sue); a MINOR breach does NOT excuse the other party\'s performance — treat a minor breach as material "at your peril" (Harrison stopping payment over a slow-maintained sign was itself the material breach).'},
      {t:'rule', n:'Seminar 13 — UCC PERFECT TENDER + SELLER\'S RIGHT TO CURE (Bartus v. Riccardi): under the UCC a buyer may REJECT goods that fail to conform in ANY respect (the perfect-tender rule), or REVOKE acceptance if there was no reasonable chance to inspect before purchase and the defect is discovered within a reasonable time after delivery. BUT the seller has a RIGHT TO CURE: (a) if the time for performance has NOT expired, the seller may notify of intent to cure and deliver conforming goods before the deadline; and (b) even AFTER the time expires, the seller may cure if it reasonably believed the non-conforming tender would be accepted (e.g., shipping an improved model). So non-conforming performance is NOT automatically a breach under the UCC — the seller gets a chance to cure.'},
      {t:'concept', n:'Seminar 13 — the TWO REGIMES side by side (conclusion): under the COMMON LAW, whether poor performance is a breach is decided by weighing the SIX Walker v. Harrison / Rest. §241 factors (substantial performance = only a MINOR breach; falling short of substantial performance = MATERIAL). Under the UCC, poor performance in the form of NON-CONFORMING GOODS is not necessarily a breach because the seller is given TIME TO CURE (perfect tender softened by cure). Signal words for an EXPRESS condition: "if," "provided," "after," "when." IMPLIED-IN-FACT conditions are inferred from the parties\' actions / reasonable expectations / the nature of the transaction; CONSTRUCTIVE (implied-in-law) conditions are imposed by the court after the fact to prevent injustice.'}
    ]},
    { w:14, topic:'Performance — Excuse of Conditions: Wrongful Prevention, Waiver & Estoppel', tags:['excuse of conditions','prevention','waiver','estoppel','good faith'], notes:[
      {t:'concept', n:'📖 Reading — Ferriell §§8.03, 8.05, §§9.04–9.06 (Excuse of Conditions: Wrongful Prevention, Waiver & Estoppel). Required cases: Cantrell-Waind v. Guillaume Motorsports; Swartz v. War Memorial Commission; Stop & Shop v. Ganem; Market Street Associates v. Frey; Clark v. West; Schenectady Steel v. Bruno Trimpoli; Martin v. Schoenberger; Lancellotti v. Thomas.'},
      {t:'concept', n:'Module 14 — EXCUSE OF CONDITIONS (§§8.03, 8.05, 9.04–9.06): wrongful prevention/hindrance, waiver and estoppel, and the duty of good faith (Market Street Associates v. Frey; Clark v. West).'},
      {t:'exam', n:'📋 Module 14 (Excuse of Conditions — Wrongful Prevention, Waiver & Estoppel): Graded — Resource Quiz (10 pts); Seminar (2 pts).'},
      {t:'rule', n:'§8.05 EXCUSE OF CONDITIONS (Ferriell Ch. 8). A condition\'s failure does NOT discharge the duty if the condition is EXCUSED. Only ANCILLARY conditions (not a material part of the agreed exchange) can be excused. Grounds: (A) impossibility; (B) interference/hindrance; (C) repudiation; (D) waiver & estoppel; and (E) to avoid disproportionate forfeiture.'},
      {t:'rule', n:'§8.05[A] IMPOSSIBILITY. If circumstances beyond the parties\' control make a condition impossible/impracticable, an ANCILLARY condition may be excused (an unconscious insured\'s late accident notice is excused). BUT impossibility is no excuse if the very risk the condition guarded against is what occurred, or if the condition was a MATERIAL part of the exchange (timely premium payment is not excused by financial hardship). Rest. (2d) §271.'},
      {t:'rule', n:'§8.05[B] INTERFERENCE / HINDRANCE (Rest. §245). A party who WRONGFULLY prevents or hinders a condition operating for its benefit CANNOT rely on its non-occurrence (a buyer who never applies for the required mortgage; Foreman State Trust v. Tauber — a husband who murdered his wife could not use her non-survival). There is also an affirmative duty to act in good faith / cooperate (Sullivan v. Bullock).'},
      {t:'rule', n:'§8.05[C] REPUDIATION. Where a party repudiates, conditions on that party\'s duties that are within the OTHER party\'s control are excused — the law does not require useless conduct (an insurer that repudiates a claim excuses the insured\'s condition of formal notice). But the repudiation must have CONTRIBUTED to the non-occurrence; conditions excused by repudiation revive if the repudiation is retracted in time.'},
      {t:'rule', n:'§8.05[D] WAIVER & ESTOPPEL. A WAIVER is a party\'s relinquishment of a condition in its own favor; only ANCILLARY conditions can be waived — "one cannot waive himself into a duty to make a gift." Clark v. West (abstinence condition waived). ELECTION vs. WAIVER: a waiver AFTER the time for the condition (an "election") needs no reliance; a waiver BEFORE is treated under ESTOPPEL and requires the promisee\'s RELIANCE. Waiver may be implied by conduct (Standard Supply v. Reliance Insurance). Rose v. Mitsubishi distinguishes a material condition (marketable title — not waivable) from an ancillary one (time of delivery).'},
      {t:'rule', n:'§8.05[D] ESTOPPEL — equitable vs. promissory. EQUITABLE ESTOPPEL rests on reliance on a misrepresentation of PRESENT FACT (an insurer wrongly saying the premium "was received"). PROMISSORY ESTOPPEL rests on reliance on a PROMISE about the future ("we will not cancel even if you are late"). The key element of both is RELIANCE by the promisee, which can preclude the promisor from insisting on strict compliance.'},
      {t:'rule', n:'§8.05[D][4] REINSTATEMENT. A waiver made BEFORE the time for the condition can be RETRACTED / the condition reinstated by giving notice and a reasonable time — UNLESS the other party has MATERIALLY or PERMANENTLY changed position in reliance. Daniels v. Philadelphia Fair Housing (landlord could reinstate); Wolff v. McCrossan (could NOT — tenant had relied). A waiver AFTER the condition\'s time has passed cannot be reinstated.'},
      {t:'rule', n:'§8.05[D][5]-[6] WAIVER vs. MODIFICATION; ANTI-WAIVER clauses. A MODIFICATION needs mutual assent (and, at common law, consideration; not under UCC §2-209) and cannot be unilaterally retracted. A WAIVER is unilateral, needs no consideration, and (absent permanent reliance) can usually be retracted. "NO-WAIVER" provisions are themselves waivable. Boilerplate cannot strip conduct of its natural consequences.'},
      {t:'rule', n:'§8.05[E] EXCUSE TO AVOID FORFEITURE. "Equity abhors a forfeiture." An ANCILLARY condition may be excused where strict enforcement would cause a DISPROPORTIONATE forfeiture (installment land contracts; J.N.A. Realty Corp. v. Cross Bay Chelsea — a tenant\'s inadvertent late renewal notice excused to avoid losing improvements and goodwill, subject to the landlord\'s reliance). Courts balance negligence-vs-willfulness, the slightness of the delay, and prejudice. Some courts refuse (Soho Development; Guy Dean\'s Lake Shore Marina).'},
      {t:'rule', n:'§9.05 ANTICIPATORY REPUDIATION (Ferriell Ch. 9). A repudiation is a DEFINITE and UNEQUIVOCAL manifestation, BEFORE performance is due, that a party will not or cannot perform (or a voluntary act making performance impossible). Treated like a TOTAL MATERIAL BREACH: the aggrieved party may suspend, and (if not retracted) cancel and sue IMMEDIATELY for total breach (Hochster v. De La Tour). The threatened breach must be one that WOULD be material.'},
      {t:'rule', n:'§9.05[A][2] "DEFINITE AND UNEQUIVOCAL." A mere expression of doubt, a request to be RELEASED, or a request to MODIFY is NOT repudiation (Harrell v. Sea Colony; McCloskey v. Minweld Steel). UCC §2-610 / Rest. §250 relax this — a statement reasonably interpreted to mean the party will not perform suffices. Equivocal doubts give a right to DEMAND ADEQUATE ASSURANCE and can ripen into repudiation if assurances are not given.'},
      {t:'rule', n:'§9.05[A][3] PERFORMANCE MADE IMPOSSIBLE. Voluntary conduct making performance apparently impossible is repudiation (a seller who RESELLS the land). Mere financial difficulty/INSOLVENCY is usually NOT a repudiation (but may justify a demand for adequate assurance). Involuntary circumstances (strike, calamity) usually are not repudiation but may support an assurance demand.'},
      {t:'rule', n:'§9.05[B]-[C] EFFECT & RETRACTION. On repudiation the aggrieved party may (1) sue IMMEDIATELY for total breach; (2) treat itself as DISCHARGED and cancel; or (3) AWAIT performance for a commercially reasonable time and urge RETRACTION. Retraction is allowed any time before the repudiator\'s performance is due (§2-611) UNLESS the aggrieved party has cancelled or materially relied. UCC §2-610: actionable if it "substantially impairs the value of the contract"; §2-609 failure to give assurance = repudiation.'},
      {t:'rule', n:'§9.06 ADEQUATE ASSURANCE (§2-609). When "REASONABLE GROUNDS FOR INSECURITY" arise, a party may (in writing) DEMAND ADEQUATE ASSURANCE of due performance and, if commercially reasonable, SUSPEND its own performance until it receives assurance. Failure to provide adequate assurance within a reasonable time — not to exceed 30 days under the UCC — IS a REPUDIATION (§2-609(4)). Many states extend this to common-law contracts (Rest. §251; Norcon Power).'},
      {t:'rule', n:'§9.06[A] REASONABLE GROUNDS FOR INSECURITY — judged by COMMERCIAL STANDARDS. Sufficient: a seller delivering DEFECTIVE goods to other customers; reliable rumors of the buyer\'s failing finances. NOT sufficient: the buyer merely hasn\'t yet obtained a loan the contract did not require (Pittsburgh-Des Moines Steel); an unreliable third party\'s remark (Cherwell-Ralli).'},
      {t:'rule', n:'§9.06[B]-[C] DEMAND & ADEQUACY. The party must UNEQUIVOCALLY demand assurance (a mere request for info or a meeting is not enough) and may NOT demand MORE than the contract entitles it to (Pittsburgh-Des Moines — demanding escrow + guarantee not in the contract was OVERREACH, making the demander\'s own suspension a repudiation; contrast Creusot-Loire). Verbal assurances may suffice, but a history of broken assurances warrants concrete security. Failure to assure → treat as repudiation (§2-610).'},
